<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#020b18" />
  <link rel="icon" href="/logos/golf.png" />
  <title>Edit Tournament Results | NSS Golf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;650;750;850;900;950&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/site-topbar.css?v=1a744e6af25a" />
  <link rel="stylesheet" href="/admin/tournament-results.css?v=20260818-admin-mobile" />
  <link rel="stylesheet" href="/admin/dashboard-embed.css?v=20260817-admin-spinner" />
  <script src="/admin/dashboard-embed.js?v=20260817-admin-scroll"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="editor-brand">
        <a class="editor-home-btn" href="/index.html" aria-label="NSS Golf home">
          <img src="/logos/golf.png" alt="" />
        </a>
        <div class="topbar-page-title">Tournament editor</div>
      </div>
    </div>
  </header>

  <main class="editor-main">
    <section class="editor-card editor-access-panel is-loading" id="editorAccessPanel" aria-live="polite">
      <svg class="admin-loading-spinner" id="editorAccessSpinner" viewBox="0 0 24 24" role="status" aria-label="Loading tournament results"><path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg>
      <p class="editor-status" id="editorAccessStatus" hidden></p>
      <button class="editor-button primary" id="editorLoginBtn" type="button" hidden>Sign in with Discord</button>
    </section>

    <section class="editor-card" id="editorPanel" aria-labelledby="editorTitle" hidden>
      <div class="editor-page-head">
        <h1 class="editor-title" id="editorTitle">Tournament results</h1>
        <div class="editor-head-actions">
          <span class="editor-dirty-count" id="editorDirtyCount" aria-live="polite">No unsaved changes</span>
          <button class="editor-button editor-action-button" id="editorResetBtn" type="button" aria-label="Reset changes" title="Reset changes" disabled>
            <svg class="editor-button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
            <span class="editor-button-label">Reset</span>
          </button>
          <button class="editor-button editor-action-button primary" id="editorSaveBtn" type="button" aria-label="Save changes" title="Save changes" disabled>
            <svg class="editor-button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
            <span class="editor-button-label">Save changes</span>
          </button>
        </div>
      </div>

      <div class="editor-body">
        <div class="editor-period-controls" id="editorPeriodControls" aria-label="Tournament period controls" hidden>
          <div class="editor-player-filter" id="editorPlayerFilter">
            <div class="editor-player-filter-field" id="editorPlayerFilterField">
              <div class="editor-player-filter-entry" id="editorPlayerFilterEntry">
                <div class="editor-player-filter-chips" id="editorPlayerFilterChips"></div>
                <input class="editor-player-filter-input" id="editorPlayerFilterInput" type="search" placeholder="Filter by individual players" autocomplete="off" aria-label="Filter players" aria-autocomplete="list" aria-controls="editorPlayerFilterOptions" aria-expanded="false" />
              </div>
              <div class="editor-player-filter-options" id="editorPlayerFilterOptions" role="listbox" hidden></div>
            </div>
            <button class="editor-button editor-player-filter-clear" id="editorPlayerFilterClear" type="button" aria-label="Clear player filter" title="Clear player filter" hidden>
              <svg class="editor-button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12"/></svg>
              <span class="editor-button-label">Clear</span>
            </button>
          </div>
          <div class="editor-period-selects">
            <label class="editor-select-wrap">
              <span class="editor-select-label" id="editorSeasonLabel">Season</span>
              <select class="editor-select" id="editorSeasonSelect"></select>
            </label>
            <label class="editor-select-wrap" id="editorStageWrap">
              <span class="editor-select-label">Stage</span>
              <select class="editor-select" id="editorStageSelect"></select>
            </label>
          </div>
        </div>
        <div class="editor-view-tabs" id="editorViewTabs" role="tablist" aria-label="Tournament edit views" hidden></div>
        <div class="editor-tables" id="editorTables"></div>
      </div>
    </section>
  </main>

  <script type="module" src="/site-topbar.js?v=d2e1e33e4105"></script>
  <script type="module" src="/admin/tournament-results.js?v=20260818-admin-mobile"></script>
</body>
</html>

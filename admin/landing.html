<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Overview | NSS Golf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;650;750;850;900;950&display=swap" rel="stylesheet" />
  <style>
    :root{ color-scheme:dark; }
    *{ box-sizing:border-box; }
    body{
      min-height:calc(100vh - 80px);
      margin:0;
      display:grid;
      place-items:center;
      padding:24px;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:#e9eef8;
      background:transparent;
      text-align:center;
    }
    main{ max-width:460px; }
    img{ width:56px; height:56px; object-fit:contain; }
    h1{
      margin:16px 0 8px;
      color:#c7d7ff;
      font-size:28px;
      font-weight:950;
      letter-spacing:.045em;
      text-transform:uppercase;
    }
    p{ margin:0; color:#9ca3b7; font-size:13px; line-height:1.55; }
  </style>
</head>
<body>
  <main>
    <img src="/logos/golf.png" alt="" />
    <h1>Admin</h1>
    <p>Choose a tool from the sidebar to get started.</p>
  </main>
</body>
</html>

name: Internal Ranked League

on:
  schedule:
    - cron: "0 0 * * 1"
  pull_request:
    paths:
      - "bot/internal-ranked*.js"
      - "bot/internal-ranked*.sql"
      - "bot/combined-gpi*.js"
      - "bot/tournament-gpi*.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/internal-ranked.yml"
  push:
    branches:
      - main
    paths:
      - "bot/internal-ranked*.js"
      - "bot/internal-ranked*.sql"
      - "bot/combined-gpi*.js"
      - "bot/tournament-gpi*.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/internal-ranked.yml"
  workflow_dispatch:
    inputs:
      run:
        description: "What should this workflow run?"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - snapshot-current
          - snapshot-combined
          - date-combined
          - weekly-gpi
          - test-fetch
          - fetch
          - replay
          - replay-nps
          - replay-oawp
          - replay-pl
          - sync
          - sync-nps
          - sync-oawp
          - sync-pl
          - tournament-test
          - tournament-fetch
          - tournament-replay
          - tournament-sync
      seasons:
        description: "Ranked League seasons for fetch/replay/sync"
        required: true
        default: "7-12"
        type: string
      delay_ms:
        description: "Delay between TeamUp requests for fetch/sync"
        required: true
        default: "30000"
        type: string
      snapshot_dates:
        description: "Two displayed combined GPI dates, oldest first"
        required: true
        default: "2026-08-03T00:00:00Z,2026-08-10T00:00:00Z"
        type: string

permissions:
  contents: read

concurrency:
  group: internal-ranked-league
  cancel-in-progress: false

jobs:
  date-combined:
    name: Date current combined GPI snapshots
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run == 'date-combined'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set displayed GPI snapshot dates
        run: npm run gpi:date-combined -- --dates "${{ github.event.inputs.snapshot_dates }}"
        env:
          NSSGOLF_SUPABASE_URL: ${{ secrets.NSSGOLF_SUPABASE_URL }}
          NSSGOLF_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NSSGOLF_SUPABASE_SERVICE_ROLE_KEY }}

  snapshot-combined:
    name: Publish current combined GPI snapshots
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run == 'snapshot-combined'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish the two latest stored GPI snapshots
        run: npm run gpi:publish-combined
        env:
          NSSGOLF_SUPABASE_URL: ${{ secrets.NSSGOLF_SUPABASE_URL }}
          NSSGOLF_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NSSGOLF_SUPABASE_SERVICE_ROLE_KEY }}

  snapshot-current:
    name: Save current GPI snapshot marker
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run == 'snapshot-current'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Save the current complete GPI snapshot marker
        run: npm run internal-ranked:replay
        env:
          NSSGOLF_SUPABASE_URL: ${{ secrets.NSSGOLF_SUPABASE_URL }}
          NSSGOLF_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NSSGOLF_SUPABASE_SERVICE_ROLE_KEY }}

  weekly-gpi:
    name: Weekly GPI snapshot
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 180
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run == 'weekly-gpi')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test GPI replay code
        run: |
          npm run test:internal-ranked
          npm run test:tournament-gpi

      - name: Fetch new matches for the configured ranked season
        run: npm run internal-ranked:fetch -- --delay-ms "${{ github.event.inputs.delay_ms || '30000' }}"
        env:
          NSSGOLF_SUPABASE_URL: ${{ secrets.NSSGOLF_SUPABASE_URL }}
          NSSGOLF_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NSSGOLF_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Replay ranked PL history
        run: npm run internal-ranked:replay-oawp
        env:
          NSSGOLF_SUPABASE_URL: ${{ secrets.NSSGOLF_SUPABASE_URL }}
          NSSGOLF_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NSSGOLF_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Fetch eligible tournament matches and replay tournament PL history
        run: npm run tournament-gpi:sync
        env:
          NSSGOLF_SUPABASE_URL: ${{ secrets.NSSGOLF_SUPABASE_URL }}
          NSSGOLF_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NSSGOLF_SUPABASE_SERVICE_ROLE_KEY }}

      # This final replay creates the Elo marker, builds the combined rows, and
      # exposes the combined run only after every stored rating row is written.
      - name: Replay Elo history and publish the complete GPI snapshot
        run: npm run internal-ranked:replay
        env:
          NSSGOLF_SUPABASE_URL: ${{ secrets.NSSGOLF_SUPABASE_URL }}
          NSSGOLF_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NSSGOLF_SUPABASE_SERVICE_ROLE_KEY }}

  test:
    name: Test internal Ranked League scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run == 'test'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run internal Ranked League tests
        run: |
          npm run test:internal-ranked
          npm run test:tournament-gpi

      - name: Check internal Ranked League CLI syntax
        run: |
          node --check bot/internal-ranked.js
          node --check bot/internal-ranked-core.js
          node --check bot/tournament-gpi.js

  fetch:
    name: Test internal Ranked League fetch
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run == 'test-fetch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run internal Ranked League tests
        run: npm run test:internal-ranked

      - name: Fetch first 5 TeamUp pages and write Supabase
        run: npm run internal-ranked:fetch -- --seasons "${{ github.event.inputs.seasons }}" --delay-ms "${{ github.event.inputs.delay_ms }}" --max-pages 5 --allow-incomplete
        env:
          NSSGOLF_SUPABASE_URL: ${{ secrets.NSSGOLF_SUPABASE_URL }}
          NSSGOLF_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NSSGOLF_SUPABASE_SERVICE_ROLE_KEY }}

  full-fetch:
    name: Full internal Ranked League fetch
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 360
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run == 'fetch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch TeamUp matches and write Supabase
        run: npm run internal-ranked:fetch -- --seasons "${{ github.event.inputs.seasons }}" --delay-ms "${{ github.event.inputs.delay_ms }}"
        env:
          NSSGOLF_SUPABASE_URL: ${{ secrets.NSSGOLF_SUPABASE_URL }}
          NSSGOLF_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NSSGOLF_SUPABASE_SERVICE_ROLE_KEY }}

  replay:
    name: Internal Ranked League Elo replay
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run == 'replay'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Replay Elo from stored matches
        run: npm run internal-ranked:replay -- --seasons "${{ github.event.inputs.seasons }}"
        env:
          NSSGOLF_SUPABASE_URL: ${{ secrets.NSSGOLF_SUPABASE_URL }}
          NSSGOLF_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NSSGOLF_SUPABASE_SERVICE_ROLE_KEY }}

  replay-pl:
    name: Internal Ranked League flat PL GPI replay
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run == 'replay-pl'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Replay flat Plackett-Luce NSS GPI from stored matches
        run: npm run internal-ranked:replay-pl -- --seasons "${{ github.event.inputs.seasons }}"
        env:
          NSSGOLF_SUPABASE_URL: ${{ secrets.NSSGOLF_SUPABASE_URL }}
          NSSGOLF_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NSSGOLF_SUPABASE_SERVICE_ROLE_KEY }}

  replay-nps:
    name: Internal Ranked League GPI NPS Elo replay
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run == 'replay-nps'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Replay GPI NPS Elo from stored matches
        run: npm run internal-ranked:replay-nps -- --seasons "${{ github.event.inputs.seasons }}"
        env:
          NSSGOLF_SUPABASE_URL: ${{ secrets.NSSGOLF_SUPABASE_URL }}
          NSSGOLF_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NSSGOLF_SUPABASE_SERVICE_ROLE_KEY }}

  replay-oawp:
    name: Internal Ranked League Opponent-Aware Weighted Pairwise GPI replay
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run == 'replay-oawp'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Replay Opponent-Aware Weighted Pairwise GPI from stored matches
        run: npm run internal-ranked:replay-oawp -- --seasons "${{ github.event.inputs.seasons }}"
        env:
          NSSGOLF_SUPABASE_URL: ${{ secrets.NSSGOLF_SUPABASE_URL }}
          NSSGOLF_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NSSGOLF_SUPABASE_SERVICE_ROLE_KEY }}

  sync:
    name: Full internal Ranked League fetch and Elo replay
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 360
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run == 'sync'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch TeamUp matches, write Supabase, and replay Elo
        run: npm run internal-ranked:sync -- --seasons "${{ github.event.inputs.seasons }}" --delay-ms "${{ github.event.inputs.delay_ms }}"
        env:
          NSSGOLF_SUPABASE_URL: ${{ secrets.NSSGOLF_SUPABASE_URL }}
          NSSGOLF_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NSSGOLF_SUPABASE_SERVICE_ROLE_KEY }}

  sync-pl:
    name: Full internal Ranked League fetch and flat PL GPI replay
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 360
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run == 'sync-pl'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch TeamUp matches, write Supabase, and replay flat Plackett-Luce NSS GPI
        run: npm run internal-ranked:sync-pl -- --seasons "${{ github.event.inputs.seasons }}" --delay-ms "${{ github.event.inputs.delay_ms }}"
        env:
          NSSGOLF_SUPABASE_URL: ${{ secrets.NSSGOLF_SUPABASE_URL }}
          NSSGOLF_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NSSGOLF_SUPABASE_SERVICE_ROLE_KEY }}

  sync-nps:
    name: Full internal Ranked League fetch and GPI NPS Elo replay
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 360
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run == 'sync-nps'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch TeamUp matches, write Supabase, and replay GPI NPS Elo
        run: npm run internal-ranked:sync-nps -- --seasons "${{ github.event.inputs.seasons }}" --delay-ms "${{ github.event.inputs.delay_ms }}"
        env:
          NSSGOLF_SUPABASE_URL: ${{ secrets.NSSGOLF_SUPABASE_URL }}
          NSSGOLF_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NSSGOLF_SUPABASE_SERVICE_ROLE_KEY }}

  sync-oawp:
    name: Full internal Ranked League fetch and Opponent-Aware Weighted Pairwise GPI replay
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 360
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run == 'sync-oawp'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch TeamUp matches, write Supabase, and replay Opponent-Aware Weighted Pairwise GPI
        run: npm run internal-ranked:sync-oawp -- --seasons "${{ github.event.inputs.seasons }}" --delay-ms "${{ github.event.inputs.delay_ms }}"
        env:
          NSSGOLF_SUPABASE_URL: ${{ secrets.NSSGOLF_SUPABASE_URL }}
          NSSGOLF_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NSSGOLF_SUPABASE_SERVICE_ROLE_KEY }}

  tournament-test:
    name: Test Tournament GPI scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run == 'tournament-test'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Tournament GPI tests
        run: npm run test:tournament-gpi

      - name: Check Tournament GPI CLI syntax
        run: node --check bot/tournament-gpi.js

  tournament-fetch:
    name: Tournament GPI fetch
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run == 'tournament-fetch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Tournament GPI tests
        run: npm run test:tournament-gpi

      - name: Fetch tournament matches and write Supabase
        run: npm run tournament-gpi:fetch
        env:
          NSSGOLF_SUPABASE_URL: ${{ secrets.NSSGOLF_SUPABASE_URL }}
          NSSGOLF_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NSSGOLF_SUPABASE_SERVICE_ROLE_KEY }}

  tournament-replay:
    name: Tournament GPI flat PL replay
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run == 'tournament-replay'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Replay Tournament GPI from stored matches
        run: npm run tournament-gpi:replay
        env:
          NSSGOLF_SUPABASE_URL: ${{ secrets.NSSGOLF_SUPABASE_URL }}
          NSSGOLF_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NSSGOLF_SUPABASE_SERVICE_ROLE_KEY }}

  tournament-sync:
    name: Tournament GPI fetch and flat PL replay
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 120
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run == 'tournament-sync'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Tournament GPI tests
        run: npm run test:tournament-gpi

      - name: Fetch tournament matches, write Supabase, and replay Tournament GPI
        run: npm run tournament-gpi:sync
        env:
          NSSGOLF_SUPABASE_URL: ${{ secrets.NSSGOLF_SUPABASE_URL }}
          NSSGOLF_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NSSGOLF_SUPABASE_SERVICE_ROLE_KEY }}

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check topbar asset versions
        run: npm run check:topbar-assets

      - name: Test admin and tournament pages
        run: |
          npm run test:tournament-editor
          npm run test:admin-dashboard
          npm run test:championship-page
          npm run test:worker

      - name: Build bundled assets
        run: |
          npm run build:home-tabs
          npm run build:lightningcup-radix
          npm run build:noptational-tabs
          npm run build:superleague-tabs
          npm run build:worldcup-tabs

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='bot/' \
            --exclude='functions/' \
            --exclude='worker/' \
            --exclude='supabase/' \
            --exclude='scripts/' \
            --exclude='admin/*.test.mjs' \
            --exclude='.DS_Store' \
            --exclude='.dockerignore' \
            --exclude='.env*' \
            --exclude='.gitignore' \
            --exclude='Dockerfile' \
            --exclude='fly.toml' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='README.md' \
            --exclude='*.jsx' \
            --exclude='*.sql' \
            ./ _site/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    name: Deploy static site
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#020B18" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="/logos/golf.png" />
  <title>World Golf Masters</title>

  <style>
    :root{
      --bg1:#061C3B; --bg2:#04142E; --bg3:#020B18;
      --card-bg:rgba(15,23,42,1);
      --card-shadow:0 32px 32px rgba(0,0,0,0.65);
      --text:#e9eef8;
      --title:#c7d7ff;
      --muted:#9ca3c7;
      --line:rgba(255,255,255,0.12);
      --btn-bg:rgba(255,255,255,0.06);
      --btn-bg-hover:rgba(255,255,255,0.10);
      --btn-border:rgba(255,255,255,0.15);
      --btn-border-hover:rgba(255,255,255,0.28);
      --masters-gold:#facc15;
      --masters-gold-soft:#fde68a;
      --masters-purple:#d176ff;
      --masters-yellow:#f6ff6a;
      --masters-red:#ff5a5a;
      --masters-silver:#e5e7eb;
      --masters-bronze:#d97706;
      --region-accent-rgb:250,204,21;
      --qualifier-round-column-width:264px;
      --qualifier-match-height:64px;
      --qualifier-seed-col-width:14px;
      --qualifier-score-col-width:28px;
      --qualifier-score-col-gap:2px;
      --qualifier-final-score-width:24px;
      --qualifier-visible-games-width:88px;
      --qualifier-scorepack-width:118px;
    }

    *{ box-sizing:border-box; }
    [hidden]{ display:none !important; }
    html{ background-color:var(--bg3); }
    body{
      margin:0;
      min-height:100vh;
      font-family:Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color:var(--text);
      background-color:var(--bg3);
      background-image:linear-gradient(to bottom, var(--bg1), var(--bg2), var(--bg3));
    }
    .topbar{
      position:sticky;
      top:0;
      z-index:10;
      border-bottom:1px solid rgba(255,255,255,.10);
      background:rgba(3,18,42,.70);
      backdrop-filter:blur(10px);
    }
    .topbar-inner{
      max-width:1180px;
      margin:0 auto;
      padding:14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }
    .brand{
      display:flex;
      gap:12px;
      align-items:center;
      min-width:0;
    }
    .home-btn{
      width:40px;
      height:40px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.15);
      background:rgba(255,255,255,.05);
      display:grid;
      place-items:center;
      overflow:hidden;
      text-decoration:none;
      flex:0 0 auto;
    }
    .home-btn:hover{
      background:rgba(255,255,255,.08);
      border-color:rgba(255,255,255,.25);
    }
    .home-btn img{
      width:70%;
      height:70%;
      object-fit:contain;
      display:block;
      pointer-events:none;
    }
    .kicker{
      font-size:11px;
      letter-spacing:.25em;
      text-transform:uppercase;
      color:rgba(255,255,255,.65);
      font-weight:900;
    }
    .page-nav-select{
      background:rgba(2,6,23,.85);
      color:inherit;
      border:1px solid rgba(125,211,252,.35);
      border-radius:10px;
      padding:6px 32px 6px 10px;
      font:inherit;
      letter-spacing:inherit;
      text-transform:uppercase;
      max-width:min(56vw, 420px);
      cursor:pointer;
    }
    .page-nav-select:focus-visible{
      outline:2px solid rgba(125,211,252,.6);
      outline-offset:2px;
    }
    .btn{
      appearance:none;
      -webkit-appearance:none;
      border:1px solid var(--btn-border);
      background:var(--btn-bg);
      color:rgba(255,255,255,0.92);
      padding:8px 12px;
      border-radius:14px;
      font-weight:950;
      text-transform:uppercase;
      letter-spacing:.08em;
      font-size:11px;
      cursor:pointer;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      line-height:1;
      flex-shrink:0;
    }
    .btn:hover{
      background:var(--btn-bg-hover);
      border-color:var(--btn-border-hover);
    }
    .btn-icon{
      width:14px;
      height:14px;
      display:block;
    }
    .container{
      max-width:1180px;
      margin:0 auto;
      padding:28px 18px 56px;
    }
    .card{
      width:100%;
      background:var(--card-bg);
      border-radius:20px;
      padding:22px 20px;
      box-shadow:var(--card-shadow);
      border:1px solid rgba(255,255,255,0.10);
    }
    .card-head{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:16px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }
    .headline{
      margin:0;
      color:var(--title);
      font-size:24px;
      font-weight:950;
      letter-spacing:.035em;
      text-transform:uppercase;
    }
    .lede{
      margin:8px 0 0;
      max-width:760px;
      color:rgba(233,238,248,.78);
      font-size:14px;
      font-weight:750;
      line-height:1.45;
    }
    .masters-tabs{
      width:100%;
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:0;
      margin:14px 0 18px;
      border-bottom:1px solid rgba(148,163,184,.24);
    }
    .masters-tab{
      position:relative;
      min-height:35px;
      border:0;
      border-radius:0;
      background:transparent;
      color:rgba(233,238,248,.86);
      padding:6px 8px 7px;
      text-align:center;
      line-height:1.2;
      font:inherit;
      font-size:11px;
      font-weight:850;
      letter-spacing:.06em;
      text-transform:uppercase;
      appearance:none;
      cursor:pointer;
      transition:background-color 140ms ease, color 140ms ease, box-shadow 140ms ease;
    }
    .masters-tab::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      height:2px;
      background:transparent;
      transition:background-color 140ms ease;
    }
    .masters-tab:hover{
      background:rgba(148,163,184,.10);
      color:rgba(255,255,255,.95);
    }
    .masters-tab[data-state="active"]{
      background:rgba(var(--region-accent-rgb), .09);
      color:#fff8dc;
    }
    .masters-tab[data-state="active"]::after{
      background:rgba(var(--region-accent-rgb), .82);
    }
    .masters-tab:focus-visible{
      outline:none;
      box-shadow:inset 0 0 0 1px rgba(var(--region-accent-rgb), .48);
    }
    .panel{
      display:grid;
      gap:18px;
    }
    .section-title{
      margin:0;
      color:rgba(255,255,255,.94);
      font-size:14px;
      font-weight:950;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .defending-champion-card{
      position:relative;
      display:grid;
      grid-template-columns:minmax(0, 1fr) auto;
      gap:18px;
      align-items:center;
      padding:18px;
      border:1px solid rgba(250,204,21,.42);
      border-radius:16px;
      background:linear-gradient(135deg, rgba(250,204,21,.18), rgba(250,204,21,.055) 44%, rgba(255,255,255,.04));
      box-shadow:0 18px 34px rgba(0,0,0,.34), 0 0 30px rgba(250,204,21,.10);
      overflow:hidden;
    }
    .defending-champion-card::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:inherit;
      pointer-events:none;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.14);
    }
    .defending-champion-label{
      margin:0 0 10px;
      color:var(--masters-gold-soft);
      font-size:12px;
      font-weight:950;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .defending-champion-player{
      display:inline-flex;
      align-items:center;
      min-width:0;
      gap:14px;
      color:#fff;
      text-decoration:none;
    }
    .defending-champion-avatar{
      width:58px;
      height:58px;
      border-radius:50%;
      object-fit:cover;
      border:2px solid rgba(250,204,21,.74);
      background:rgba(255,255,255,.08);
      box-shadow:0 0 18px rgba(250,204,21,.20);
      flex:0 0 auto;
    }
    .defending-champion-name{
      min-width:0;
      overflow:hidden;
      color:#fff;
      font-size:26px;
      font-weight:950;
      letter-spacing:.025em;
      line-height:1.05;
      text-overflow:ellipsis;
      text-transform:uppercase;
      white-space:nowrap;
    }
    .table-scroll{
      width:100%;
      overflow-x:auto;
      border:1px solid var(--line);
      border-radius:14px;
      background:rgba(2,6,23,.28);
    }
    .qualifiers-table{
      width:100%;
      min-width:640px;
      border-collapse:separate;
      border-spacing:0;
    }
    .qualifiers-table th,
    .qualifiers-table td{
      padding:10px 12px;
      border-bottom:1px solid rgba(148,163,184,.18);
      vertical-align:middle;
    }
    .qualifiers-table th{
      color:var(--muted);
      background:rgba(148,163,184,.08);
      font-size:10px;
      font-weight:950;
      letter-spacing:.08em;
      text-align:left;
      text-transform:uppercase;
      white-space:nowrap;
    }
    .qualifiers-table th:last-child,
    .qualifiers-table td:last-child{
      text-align:right;
      padding-right:16px;
    }
    .qualifiers-table tbody tr:last-child td{
      border-bottom:0;
    }
    .qualifier-player-link,
    .qualifier-player-static{
      display:inline-flex;
      align-items:center;
      min-width:0;
      gap:10px;
      color:#fff;
      text-decoration:none;
    }
    .qualifier-player-link:hover .qualifier-name{
      color:var(--masters-gold-soft);
      text-decoration:underline;
    }
    .qualifier-avatar{
      width:34px;
      height:34px;
      border-radius:50%;
      object-fit:cover;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.08);
      flex:0 0 auto;
    }
    .qualifier-name{
      min-width:0;
      overflow:hidden;
      color:#fff;
      font-size:13px;
      font-weight:950;
      letter-spacing:.02em;
      text-overflow:ellipsis;
      text-transform:uppercase;
      white-space:nowrap;
    }
    .qualification-chips{
      display:flex;
      justify-content:flex-end;
      flex-wrap:wrap;
      gap:6px;
    }
    .qualification-chip{
      --chip-color:rgba(148,163,184,.92);
      display:inline-flex;
      align-items:center;
      gap:3px;
      min-height:24px;
      padding:4px 8px;
      border:1px solid color-mix(in srgb, var(--chip-color) 82%, transparent);
      border-radius:999px;
      background:color-mix(in srgb, var(--chip-color) 14%, transparent);
      color:var(--chip-color);
      box-shadow:0 0 12px color-mix(in srgb, var(--chip-color) 18%, transparent);
      font-size:10px;
      font-weight:950;
      letter-spacing:.05em;
      line-height:1.1;
      text-transform:uppercase;
      white-space:nowrap;
    }
    .qualification-chip.is-gold{ --chip-color:var(--masters-gold); }
    .qualification-chip.is-purple{ --chip-color:var(--masters-purple); }
    .qualification-chip.is-yellow{ --chip-color:var(--masters-yellow); }
    .qualification-chip.is-red{ --chip-color:var(--masters-red); }
    .qualification-chip .sl-main,
    .qualification-chip .sl-season{
      color:var(--masters-purple);
    }
    .qualification-chip .sl-division.is-d1{ color:var(--masters-gold); }
    .qualification-chip .sl-division.is-d2{ color:var(--masters-silver); }
    .qualification-chip .sl-division.is-d3{ color:var(--masters-bronze); }
    .empty-state,
    .status{
      margin:0;
      padding:18px;
      color:var(--muted);
      font-size:13px;
      font-weight:850;
      text-align:center;
    }
    .status.is-error{ color:#fca5a5; }
    .qualifier-tournament-bracket{
      display:grid;
      gap:10px;
    }
    .coming-soon{
      display:grid;
      min-height:120px;
      place-items:center;
      border:1px dashed rgba(250,204,21,.34);
      border-radius:14px;
      background:rgba(2,6,23,.28);
      color:rgba(250,204,21,.86);
      font-size:18px;
      font-weight:950;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .qualifier-bracket-scroll{
      width:100%;
      overflow-x:auto;
      overflow-y:hidden;
      padding-bottom:4px;
      border:1px solid var(--line);
      border-radius:14px;
      background:rgba(2,6,23,.28);
    }
    .qualifier-bracket-grid{
      display:grid;
      grid-auto-flow:column;
      grid-auto-columns:var(--qualifier-round-column-width);
      gap:18px;
      align-items:start;
      width:max-content;
      min-width:100%;
      justify-content:center;
      padding:14px;
    }
    #mastersBracketGrid{
      --qualifier-round-column-width:401px;
      --qualifier-visible-games-width:148px;
      --qualifier-scorepack-width:227px;
    }
    #mastersBracketGrid .qualifier-player-scorepack{
      display:grid;
      grid-template-columns:minmax(0, var(--qualifier-visible-games-width)) var(--qualifier-final-score-width);
      justify-content:end;
      justify-items:end;
    }
    #mastersBracketGrid .qualifier-player-scorepack.has-sudden-death{
      grid-template-columns:minmax(0, var(--qualifier-visible-games-width)) 35px var(--qualifier-final-score-width);
    }
    #mastersBracketGrid .qualifier-player-sudden-death-score{
      width:35px;
      min-height:16px;
      border-left:1px solid rgba(148,163,184,.46);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      padding-left:6px;
      font-weight:900;
      font-variant-numeric:tabular-nums;
      text-align:center;
    }
    #mastersBracketGrid .qualifier-player-final-score{
      grid-column:2;
    }
    #mastersBracketGrid .qualifier-player-scorepack.has-sudden-death .qualifier-player-final-score{
      grid-column:3;
    }
    .qualifier-round-column{
      display:flex;
      flex-direction:column;
      gap:8px;
      min-width:0;
    }
    .qualifier-round-title{
      margin:0;
      color:var(--muted);
      font-size:10px;
      font-weight:900;
      letter-spacing:.09em;
      text-align:center;
      text-transform:uppercase;
    }
    .qualifier-round-stack{
      display:flex;
      flex-direction:column;
      gap:var(--qualifier-round-gap, 8px);
    }
    .qualifier-round-stack .qualifier-bracket-match:first-child{
      padding-top:var(--qualifier-round-padding-top, 0px);
    }
    .qualifier-round-stack .qualifier-bracket-match + .qualifier-bracket-match{
      padding-top:var(--qualifier-round-gap, 8px);
    }
    .qualifier-bracket-match{
      display:block;
      width:100%;
      min-height:var(--qualifier-match-height);
    }
    .qualifier-match-card{
      position:relative;
      width:100%;
      min-width:0;
      border-radius:10px;
      overflow:hidden;
      background:rgba(255,255,255,.05);
      isolation:isolate;
    }
    .qualifier-match-card::before{
      content:"";
      position:absolute;
      inset:0;
      z-index:3;
      border:1px solid rgba(255,255,255,.08);
      border-radius:inherit;
      pointer-events:none;
    }
    .qualifier-match-row{
      width:100%;
      min-height:24px;
      position:relative;
      z-index:1;
      display:grid;
      grid-template-columns:var(--qualifier-seed-col-width) minmax(0, 1fr) var(--qualifier-scorepack-width);
      align-items:center;
      gap:8px;
      padding:3px 5px 3px 6px;
      border:0;
      background:rgba(255,255,255,.06);
      color:var(--muted);
      font-size:10px;
      text-align:left;
    }
    .qualifier-match-row.no-score{
      grid-template-columns:var(--qualifier-seed-col-width) minmax(0, 1fr);
    }
    .qualifier-match-row.has-score{
      padding-top:0;
      padding-bottom:0;
    }
    .qualifier-match-row:first-child{
      border-top-left-radius:10px;
      border-top-right-radius:10px;
    }
    .qualifier-match-row:last-child{
      border-bottom-left-radius:10px;
      border-bottom-right-radius:10px;
    }
    .qualifier-match-row:nth-child(2){
      background:rgba(255,255,255,.045);
    }
    .qualifier-match-row + .qualifier-match-row{
      border-top:1px solid rgba(148,163,184,.38);
    }
    .qualifier-match-row.winner{
      background:rgba(var(--region-accent-rgb), .12);
      border-color:rgba(var(--region-accent-rgb), .55);
    }
    .qualifier-bracket-grid[data-bracket-mode="actual"] .qualifier-match-row.winner + .qualifier-match-row{
      border-top-color:rgba(var(--region-accent-rgb), .44);
    }
    .qualifier-bracket-grid[data-bracket-mode="actual"] .qualifier-match-row.winner:first-child::after{
      content:"";
      position:absolute;
      inset:0;
      border-top:1px solid rgba(var(--region-accent-rgb), .44);
      border-left:1px solid rgba(var(--region-accent-rgb), .44);
      border-right:1px solid rgba(var(--region-accent-rgb), .44);
      border-top-left-radius:inherit;
      border-top-right-radius:inherit;
      pointer-events:none;
    }
    .qualifier-bracket-grid[data-bracket-mode="actual"] .qualifier-match-row.winner:last-child::after{
      content:"";
      position:absolute;
      inset:0;
      border-bottom:1px solid rgba(var(--region-accent-rgb), .44);
      border-left:1px solid rgba(var(--region-accent-rgb), .44);
      border-right:1px solid rgba(var(--region-accent-rgb), .44);
      border-bottom-left-radius:inherit;
      border-bottom-right-radius:inherit;
      pointer-events:none;
    }
    .qualifier-match-card:hover::before{
      border-color:rgba(var(--region-accent-rgb), .34);
      box-shadow:0 0 16px rgba(var(--region-accent-rgb), .08);
    }
    .qualifier-player-seed{
      width:100%;
      color:var(--masters-gold-soft);
      font-weight:800;
      font-variant-numeric:tabular-nums;
      text-align:center;
    }
    .qualifier-bracket-player-name{
      min-width:0;
      overflow:hidden;
      color:rgba(255,255,255,.34);
      font-weight:900;
      letter-spacing:.02em;
      text-overflow:ellipsis;
      text-transform:uppercase;
      white-space:nowrap;
    }
    .qualifier-player-name,
    .qualifier-player-name-link{
      min-width:0;
      overflow:hidden;
      color:#fff;
      font-weight:900;
      letter-spacing:.02em;
      text-overflow:ellipsis;
      text-transform:uppercase;
      white-space:nowrap;
    }
    .qualifier-player-name-link{
      text-decoration:none;
    }
    .qualifier-player-name-link:hover{
      color:var(--masters-gold-soft);
      text-decoration:underline;
    }
    .qualifier-player-name.is-placeholder{
      color:rgba(156,163,199,.72);
      font-weight:650;
    }
    .qualifier-player-scorepack{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:6px;
      width:var(--qualifier-scorepack-width);
      min-width:var(--qualifier-scorepack-width);
    }
    .qualifier-player-score-window{
      position:relative;
      display:block;
      justify-self:end;
      width:var(--game-score-width, auto);
      max-width:var(--qualifier-visible-games-width);
      min-width:0;
      height:24px;
      overflow:hidden;
    }
    .qualifier-player-games{
      position:absolute;
      inset:0;
      display:grid;
      grid-auto-flow:column;
      grid-auto-columns:var(--qualifier-score-col-width);
      align-items:center;
      justify-self:end;
      gap:var(--qualifier-score-col-gap);
      width:100%;
      max-width:100%;
      min-width:0;
      overflow:hidden;
    }
    .qualifier-player-set-score{
      width:100%;
      min-height:16px;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      font-variant-numeric:tabular-nums;
      letter-spacing:.02em;
      text-align:center;
    }
    .qualifier-player-final-score{
      width:var(--qualifier-final-score-width);
      height:16px;
      border:1px solid #fff;
      border-radius:6px;
      background:#fff;
      color:#000;
      display:flex;
      align-items:center;
      justify-content:center;
      justify-self:stretch;
      padding:0;
      font-size:10px;
      font-weight:900;
      font-variant-numeric:tabular-nums;
      line-height:1;
      text-align:center;
      white-space:nowrap;
    }
    @media (max-width:760px){
      .container{ padding:20px 12px 44px; }
      .topbar-inner{ padding:12px; flex-wrap:nowrap; }
      .brand{ flex:1; min-width:0; }
      .brand > div{ min-width:0; }
      .page-nav-select{ width:min(100%, 420px); max-width:100%; }
      .discord-button{ padding:8px 10px; font-size:10px; letter-spacing:.06em; }
      .card{ padding:18px 14px; border-radius:18px; }
      .headline{ font-size:20px; }
      .defending-champion-card{
        grid-template-columns:1fr;
        gap:12px;
      }
      .defending-champion-avatar{
        width:48px;
        height:48px;
      }
      .defending-champion-name{ font-size:21px; }
      .table-scroll{
        overflow-x:hidden;

  <script type="module" src="/site-topbar.js?v=8909462d6be2"></script>
  <script type="module">
    import { createBrowserSupabaseClient } from "/auth/supabase-auth.js";

    const supabase = createBrowserSupabaseClient();
    const WORKER_URL = "https://small-mud-2771.nextweekmedia.workers.dev/";
    const FETCH_NO_STORE = { cache:"no-store" };
    const VIEW_QUERY_PARAM = "view";
    const MASTERS_SHEET = {
      sheetId:"16r1G1StlWQflPjAqFbHip_Y3hRo85F6iS3jYyK25CwE",
      qualifiersRange:"'Qualifiers'!A:T",
      bracketRange:"'Bracket'!A1:R16",
      discordIdsRange:"'Discord IDs'!A:B",
    };
    const BRACKET_ROUNDS = [
      { key:"R16", label:"Round of 16", matches:8 },
      { key:"R8", label:"Quarterfinals", matches:4 },
      { key:"R4", label:"Semifinals", matches:2 },
      { key:"Final", label:"Final", matches:1 },
    ];

    const state = {
      view:"bracket",
      qualifiers:[],
      qualifierBracketParticipants:[],
      qualifierBracketMatches:[],
      bracketMatches:[],
      members:new Map(),
      loading:true,
      error:"",
    };

    const els = {
      qualifiersStatus:document.getElementById("qualifiersStatus"),
      defendingChampionMount:document.getElementById("defendingChampionMount"),
      qualifiersTableWrap:document.getElementById("qualifiersTableWrap"),
      qualifiersTableBody:document.getElementById("qualifiersTableBody"),
      qualifiersPanel:document.getElementById("qualifiersPanel"),
      bracketPanel:document.getElementById("bracketPanel"),
      qualifierTournamentBracketGrid:document.getElementById("qualifierTournamentBracketGrid"),
      bracketGrid:document.getElementById("mastersBracketGrid"),
    };

    function normalizeText(value){
      return String(value ?? "").trim();
    }

    function normalizeDiscordId(value){
      const text = normalizeText(value);
      const mentionMatch = text.match(/^<@!?(\d+)>$/);
      const raw = mentionMatch ? mentionMatch[1] : text.replace(/[^\d]/g, "");
      return /^\d{5,}$/.test(raw) ? raw : "";
    }

    function normalizeNameKey(value){
      return normalizeText(value).toLowerCase().replace(/\s+/g, " ");
    }

    function escapeHtml(value){
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function normalizeValues(resp){
      if(!resp) return [];
      if(Array.isArray(resp)) return resp;
      if(Array.isArray(resp.values)) return resp.values;
      if(Array.isArray(resp.data?.values)) return resp.data.values;
      if(Array.isArray(resp.result?.values)) return resp.result.values;
      return [];
    }

    function parseSheetRange(range){
      const text = normalizeText(range);
      const match = text.match(/^'([^']+)'!(.+)$/) || text.match(/^([^!]+)!(.+)$/);
      if(match) return { sheetName:match[1], a1:match[2] };
      return { sheetName:"", a1:text };
    }

    function parseGvizResponse(text){
      const match = String(text || "").match(/google\.visualization\.Query\.setResponse\((.*)\);?\s*$/s);
      if(!match) throw new Error("Unable to parse Google Sheets response.");
      const payload = JSON.parse(match[1]);
      const rows = payload?.table?.rows ?? [];
      return rows.map(row => (row.c ?? []).map(cell => cell?.v ?? ""));
    }

    async function fetchSheetRangeGviz(sheetId, range){
      const { sheetName, a1 } = parseSheetRange(range);
      const url = new URL(`https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq`);
      url.searchParams.set("tqx", "out:json");
      if(sheetName) url.searchParams.set("sheet", sheetName);
      if(a1) url.searchParams.set("range", a1);
      const response = await fetch(url.toString(), FETCH_NO_STORE);
      if(!response.ok){
        const text = await response.text().catch(() => "");
        throw new Error(`Google Sheets request failed (${response.status}). ${text}`.trim());
      }
      return parseGvizResponse(await response.text());
    }

    async function fetchSheetRange(sheetId, range){
      const payload = { sheetId, range };
      try{
        const response = await fetch(WORKER_URL, {
          ...FETCH_NO_STORE,
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body:JSON.stringify(payload),
        });
        if(response.ok) return normalizeValues(await response.json());
      }catch{
      }

      try{
        const url = new URL(WORKER_URL);
        url.searchParams.set("sheetId", sheetId);
        url.searchParams.set("range", range);
        const response = await fetch(url.toString(), FETCH_NO_STORE);
        if(response.ok) return normalizeValues(await response.json());
      }catch{
      }

      return fetchSheetRangeGviz(sheetId, range);
    }

    function splitCsvLine(value){
      const text = normalizeText(value);
      if(!text) return [];
      const cells = [];
      let current = "";
      let inQuotes = false;
      for(let index = 0; index < text.length; index += 1){
        const char = text[index];
        const nextChar = text[index + 1];
        if(char === "\"" && inQuotes && nextChar === "\""){
          current += "\"";
          index += 1;
        }else if(char === "\""){
          inQuotes = !inQuotes;
        }else if(char === "," && !inQuotes){
          cells.push(current);
          current = "";
        }else{
          current += char;
        }
      }
      cells.push(current);
      return cells.map(normalizeText).filter(Boolean);
    }

    function splitQualifications(value){
      return normalizeText(value)
        .split(/\r?\n|;/)
        .flatMap(splitCsvLine)
        .filter(Boolean);
    }

    function isHeaderRow(row){
      const idCell = normalizeText(row?.[0]).toLowerCase();
      const qualificationCell = normalizeText(row?.[2]).toLowerCase();
      return idCell === "discord id" || qualificationCell === "qualification" || qualificationCell === "qualifications";
    }

    function parseQualifierRows(rows){
      return rows
        .filter(row => !isHeaderRow(row))
        .map((row, index) => {
          const discordId = normalizeDiscordId(row?.[0]);
          const qualifications = splitQualifications(row?.[2]);
          return { discordId, qualifications, sourceIndex:index };
        })
        .filter(row => row.discordId && row.qualifications.length);
    }

    function normalizeBracketRound(value){
      const text = normalizeText(value);
      const normalized = text.toLowerCase().replace(/[\s_-]+/g, "");
      if(["r16", "roundof16", "16"].includes(normalized)) return "R16";
      if(["r8", "roundof8", "quarterfinal", "quarterfinals", "qf", "8"].includes(normalized)) return "R8";
      if(["r4", "roundof4", "semifinal", "semifinals", "sf", "4"].includes(normalized)) return "R4";
      if(["f", "final", "finals", "championship"].includes(normalized)) return "Final";
      return text;
    }

    function bracketScore(value){
      const text = normalizeText(value);
      if(!text) return "";
      const number = Number(text);
      return Number.isFinite(number) ? String(number) : text;
    }

    function parseQualifierBracketParticipants(rows){
      const participants = [];
      rows.forEach((row) => {
        const bracketDiscordId = normalizeDiscordId(row?.[4]);
        const bracketName = normalizeText(row?.[5]);
        if(bracketDiscordId && bracketName) participants.push({ discordId:bracketDiscordId, name:bracketName });

        const qualifierDiscordId = normalizeDiscordId(row?.[0]);
        const qualifierName = normalizeText(row?.[1]);
        if(qualifierDiscordId && qualifierName) participants.push({ discordId:qualifierDiscordId, name:qualifierName });
      });
      return participants;
    }

    function bracketParticipantMap(participants){
      const discordIdsByName = new Map();
      participants.forEach((participant) => {
        discordIdsByName.set(normalizeNameKey(participant.name), participant.discordId);
      });
      return discordIdsByName;
    }

    function qualifierBracketSortValue(match){
      const idText = normalizeText(match?.id);
      const exact = Number(idText);
      if(Number.isFinite(exact)) return exact;
      const embedded = idText.match(/\d+/);
      return embedded ? Number(embedded[0]) : Number(match?.sourceIndex || 0);
    }

    function qualifierBracketSlot({ name, score, gameScores = [], suddenDeath = "", discordIdsByName }){
      return {
        seed:null,
        name:normalizeText(name),
        discordId:discordIdsByName.get(normalizeNameKey(name)) || "",
        score:bracketScore(score),
        gameScores:(Array.isArray(gameScores) ? gameScores : []).map(bracketScore).filter(Boolean),
        suddenDeath:bracketScore(suddenDeath),
      };
    }

    function parseQualifierBracketMatches(rows, participants){
      const discordIdsByName = bracketParticipantMap(participants);
      return rows
        .map((row, index) => ({
          id:normalizeText(row?.[7]) || `${index + 1}`,
          sourceIndex:index,
          round:normalizeBracketRound(row?.[8]),
          top:qualifierBracketSlot({
            name:row?.[9],
            gameScores:[row?.[10], row?.[11], row?.[12]],
            score:row?.[13],
            discordIdsByName,
          }),
          bottom:qualifierBracketSlot({
            name:row?.[14],
            gameScores:[row?.[15], row?.[16], row?.[17]],
            score:row?.[18],
            discordIdsByName,
          }),
          winner:normalizeText(row?.[19]),
        }))
        .filter(match => (
          BRACKET_ROUNDS.some(round => round.key === match.round) &&
          match.id
        ))
        .sort((left, right) => qualifierBracketSortValue(left) - qualifierBracketSortValue(right));
    }

    function parseBracketDiscordIds(rows){
      return rows
        .map(row => ({ name:normalizeText(row?.[0]), discordId:normalizeDiscordId(row?.[1]) }))
        .filter(participant => participant.name && participant.discordId);
    }

    function parseMastersBracketMatches(rows, participants){
      const discordIdsByName = bracketParticipantMap(participants);
      return rows
        .map((row, index) => ({
          id:`${index + 1}`,
          round:normalizeBracketRound(row?.[0]),
          top:qualifierBracketSlot({
            name:row?.[1],
            gameScores:row?.slice(2, 7),
            suddenDeath:row?.[7],
            score:row?.[8],
            discordIdsByName,
          }),
          bottom:qualifierBracketSlot({
            name:row?.[9],
            gameScores:row?.slice(10, 15),
            suddenDeath:row?.[15],
            score:row?.[16],
            discordIdsByName,
          }),
          winner:normalizeText(row?.[17]),
        }))
        .filter(match => BRACKET_ROUNDS.some(round => round.key === match.round));
    }

    function qualificationKind(qualification){
      const text = normalizeText(qualification);
      if(/^defending champion$/i.test(text)) return "defending";
      if(/^super league\b/i.test(text)) return "super-league";
      if(/^lightning cup$/i.test(text)) return "lightning-cup";
      if(/^ranked\b/i.test(text)) return "ranked";
      return "default";
    }

    function isDefendingChampion(row){
      return row.qualifications.some(qualification => qualificationKind(qualification) === "defending");
    }

    function chipClass(qualification){
      const kind = qualificationKind(qualification);
      if(kind === "defending") return "is-gold";
      if(kind === "super-league") return "is-purple";
      if(kind === "lightning-cup") return "is-yellow";
      if(kind === "ranked") return "is-red";
      return "";
    }

    function renderSuperLeagueChipText(qualification){
      const text = normalizeText(qualification);
      const escaped = escapeHtml(text);
      return escaped.replace(
        /^(Super League)(\s+S(?:eason\s*)?\d+|\s+\d+)?(\s+\(?D([123])\)?)?/i,
        (match, league, season = "", division = "", divisionNumber = "") => {
          const divisionClass = divisionNumber ? ` is-d${divisionNumber}` : "";
          return `<span class="sl-main">${escapeHtml(league)}</span>${season ? `<span class="sl-season">${escapeHtml(season)}</span>` : ""}${division ? `<span class="sl-division${divisionClass}">${escapeHtml(division)}</span>` : ""}`;
        }
      );
    }

    function renderQualificationChip(qualification){
      const kind = qualificationKind(qualification);
      const label = kind === "super-league" ? renderSuperLeagueChipText(qualification) : escapeHtml(qualification);
      return `<span class="qualification-chip ${chipClass(qualification)}">${label}</span>`;
    }

    function memberDisplayName(discordId){
      const member = state.members.get(discordId);
      return normalizeText(member?.display_name) || normalizeText(member?.username) || discordId || "Player";
    }

    function avatarUrlFor(discordId){
      const member = state.members.get(discordId);
      return member?.server_avatar_url || member?.avatar_url || "/logos/golf.png";
    }

    function renderPlayer(row, { large = false } = {}){
      const displayName = memberDisplayName(row.discordId);
      const avatarClass = large ? "defending-champion-avatar" : "qualifier-avatar";
      const nameClass = large ? "defending-champion-name" : "qualifier-name";
      const linkClass = large ? "defending-champion-player" : "qualifier-player-link";
      const inner = `
        <img class="${avatarClass}" src="${escapeHtml(avatarUrlFor(row.discordId))}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" />
        <span class="${nameClass}">${escapeHtml(displayName)}</span>
      `;
      return `<a class="${linkClass}" href="/player.html?id=${encodeURIComponent(row.discordId)}" aria-label="View ${escapeHtml(displayName)}'s player page">${inner}</a>`;
    }

    async function loadMembers(){
      const ids = [...new Set([
        ...state.qualifiers.map(row => normalizeDiscordId(row.discordId)),
        ...state.qualifierBracketParticipants.map(row => normalizeDiscordId(row.discordId)),
      ].filter(Boolean))];
      if(!ids.length) return;
      const chunks = [];
      for(let index = 0; index < ids.length; index += 100){
        chunks.push(ids.slice(index, index + 100));
      }
      await Promise.all(chunks.map(async (chunk) => {
        const { data, error } = await supabase
          .from("discord_guild_members")
          .select("discord_user_id,username,display_name,avatar_url,server_avatar_url")
          .in("discord_user_id", chunk);
        if(error) throw error;
        chunk.forEach(id => state.members.set(id, null));
        (data || []).forEach((member) => {
          const id = normalizeDiscordId(member.discord_user_id);
          if(id) state.members.set(id, { ...member, discord_user_id:id });
        });
      }));
    }

    function renderDefendingChampion(){
      const champion = state.qualifiers.find(isDefendingChampion);
      if(!champion){
        els.defendingChampionMount.innerHTML = "";
        return;
      }
      els.defendingChampionMount.innerHTML = `
        <section class="defending-champion-card" aria-label="Defending Champion">
          <div>
            <p class="defending-champion-label">Defending Champion</p>
            ${renderPlayer(champion, { large:true })}
          </div>
        </section>
      `;
    }

    function renderQualifierTable(){
      const rows = state.qualifiers.filter(row => !isDefendingChampion(row));
      els.qualifiersTableWrap.hidden = !rows.length;
      if(!rows.length){
        els.qualifiersTableBody.innerHTML = "";
        return;
      }
      els.qualifiersTableBody.innerHTML = rows.map(row => `
        <tr>
          <td>${renderPlayer(row)}</td>
          <td><div class="qualification-chips">${row.qualifications.map(renderQualificationChip).join("")}</div></td>
        </tr>
      `).join("");
    }

    function renderQualifierBracketPlayerName(slot){
      const name = normalizeText(slot?.name);
      if(!name) return `<span class="qualifier-player-name is-placeholder">&nbsp;</span>`;
      const safeName = escapeHtml(name);
      const discordId = normalizeDiscordId(slot?.discordId);
      if(!discordId) return `<span class="qualifier-player-name">${safeName}</span>`;
      return `<a class="qualifier-player-name-link" href="/player.html?id=${encodeURIComponent(discordId)}" aria-label="View ${safeName}'s player page">${safeName}</a>`;
    }

    function renderQualifierBracketScore(slot){
      const gameScores = Array.isArray(slot?.gameScores) ? slot.gameScores.filter(score => normalizeText(score)) : [];
      const suddenDeath = normalizeText(slot?.suddenDeath);
      const scoreWidth = gameScores.length > 0
        ? (gameScores.length * 28) + ((gameScores.length - 1) * 2)
        : 0;
      const gamesMarkup = gameScores.length > 0
        ? `<span class="qualifier-player-score-window" style="--game-score-width:${scoreWidth}px;"><span class="qualifier-player-games">${gameScores.map(score => `<span class="qualifier-player-set-score">${escapeHtml(score)}</span>`).join("")}</span></span>`
        : "";
      const suddenDeathMarkup = suddenDeath
        ? `<span class="qualifier-player-sudden-death-score" aria-label="Sudden Death score">${escapeHtml(suddenDeath)}</span>`
        : "";
      return `<span class="qualifier-player-scorepack${suddenDeath ? " has-sudden-death" : ""}">${gamesMarkup}${suddenDeathMarkup}<span class="qualifier-player-final-score">${escapeHtml(slot?.score ?? "")}</span></span>`;
    }

    function renderQualifierBracketRow(match, slot, { showScore = true } = {}){
      const isWinner = normalizeText(match?.winner) && normalizeNameKey(match.winner) === normalizeNameKey(slot?.name);
      const rowClasses = [
        "qualifier-match-row",
        showScore ? "has-score" : "no-score",
        isWinner ? "winner" : "",
      ].filter(Boolean).join(" ");
      return `
        <div class="${rowClasses}" data-match-id="${escapeHtml(match?.id || "")}" data-name="${escapeHtml(slot?.name || "")}">
          <span class="qualifier-player-seed">${escapeHtml(slot?.seed ?? "")}</span>
          ${renderQualifierBracketPlayerName(slot)}
          ${showScore ? renderQualifierBracketScore(slot) : ""}
        </div>
      `;
    }

    function emptyQualifierBracketMatch(roundKey, index){
      return {
        id:`${roundKey}-${index + 1}`,
        round:roundKey,
        top:{ seed:null, name:"", discordId:"", score:"", gameScores:[], suddenDeath:"" },
        bottom:{ seed:null, name:"", discordId:"", score:"", gameScores:[], suddenDeath:"" },
        winner:"",
      };
    }

    function qualifierBracketGroups(matches){
      return BRACKET_ROUNDS.map((round) => {
        const roundMatches = matches.filter(match => match.round === round.key);
        const paddedMatches = Array.from({ length:round.matches }, (_, index) => roundMatches[index] || emptyQualifierBracketMatch(round.key, index));
        return { ...round, matches:paddedMatches };
      });
    }

    function renderQualifierTournamentBracket(){
      if(!els.qualifierTournamentBracketGrid) return;
      if(state.loading){
        renderBracketGrid(els.qualifierTournamentBracketGrid, []);
        return;
      }
      if(state.error){
        els.qualifierTournamentBracketGrid.innerHTML = "";
        return;
      }
      if(!state.qualifierBracketMatches.length){
        els.qualifierTournamentBracketGrid.innerHTML = `<p class="empty-state">No qualifier bracket data available yet.</p>`;
        return;
      }
      renderBracketGrid(els.qualifierTournamentBracketGrid, state.qualifierBracketMatches);
    }

    function renderQualifiers(){
      if(state.loading){
        els.qualifiersStatus.hidden = false;
        els.qualifiersStatus.className = "status";
        els.qualifiersStatus.textContent = "Loading qualifiers...";
        els.defendingChampionMount.innerHTML = "";
        els.qualifiersTableWrap.hidden = true;
        renderQualifierTournamentBracket();
        return;
      }
      if(state.error){
        els.qualifiersStatus.hidden = false;
        els.qualifiersStatus.className = "status is-error";
        els.qualifiersStatus.textContent = state.error;
        els.defendingChampionMount.innerHTML = "";
        els.qualifiersTableWrap.hidden = true;
        renderQualifierTournamentBracket();
        return;
      }
      if(!state.qualifiers.length){
        els.qualifiersStatus.hidden = false;
        els.qualifiersStatus.className = "status";
        els.qualifiersStatus.textContent = "No qualifiers available yet.";
        els.defendingChampionMount.innerHTML = "";
        els.qualifiersTableWrap.hidden = true;
        renderQualifierTournamentBracket();
        return;
      }
      els.qualifiersStatus.hidden = true;
      renderDefendingChampion();
      renderQualifierTable();
      renderQualifierTournamentBracket();
    }

    function renderBracketGrid(target, matches = [], { showScores = true } = {}){
      const groups = qualifierBracketGroups(matches);
      const baseRoundGap = 8;
      const matchBlockHeight = 64;
      const baseRoundStep = matchBlockHeight + (baseRoundGap * 2);
      target.dataset.bracketMode = "actual";
      target.innerHTML = groups.map((round, roundIndex) => {
        const roundMultiplier = 2 ** roundIndex;
        const roundGap = Math.round((baseRoundStep * roundMultiplier - matchBlockHeight) / 2);
        const roundTopPadding = roundIndex === 0 ? 0 : Math.round((baseRoundStep * (roundMultiplier - 1)) / 2);
        const matchesMarkup = round.matches.map((match) => `
          <div class="qualifier-bracket-match">
            <div class="qualifier-match-card">
              ${renderQualifierBracketRow(match, match.top, { showScore:showScores })}
              ${renderQualifierBracketRow(match, match.bottom, { showScore:showScores })}
            </div>
          </div>
        `).join("");
        return `
          <div class="qualifier-round-column" style="--qualifier-round-gap:${roundGap}px;--qualifier-round-padding-top:${roundTopPadding}px;">
            <h3 class="qualifier-round-title">${escapeHtml(round.label)}</h3>
            <div class="qualifier-round-stack">${matchesMarkup}</div>
          </div>
        `;
      }).join("");
    }

    function renderMastersBracket(){
      if(state.loading){
        renderBracketGrid(els.bracketGrid, []);
        return;
      }
      if(state.error){
        els.bracketGrid.innerHTML = `<p class="empty-state">${escapeHtml(state.error)}</p>`;
        return;
      }
      if(!state.bracketMatches.length){
        els.bracketGrid.innerHTML = `<p class="empty-state">No bracket data available yet.</p>`;
        return;
      }
      renderBracketGrid(els.bracketGrid, state.bracketMatches);
    }

    function isValidView(view){
      return ["qualifiers", "bracket"].includes(view);
    }

    function requestedViewFromUrl(){
      const view = new URLSearchParams(window.location.search).get(VIEW_QUERY_PARAM);
      return isValidView(view) ? view : "bracket";
    }

    function writeViewUrlState(historyMode = "push"){
      const url = new URL(window.location.href);
      url.searchParams.set(VIEW_QUERY_PARAM, state.view);
      const nextUrl = `${url.pathname}${url.search}${url.hash}`;
      if(nextUrl === `${window.location.pathname}${window.location.search}${window.location.hash}`) return;
      window.history[historyMode === "replace" ? "replaceState" : "pushState"]({}, "", nextUrl);
    }

    function setView(view, { updateUrl = true, historyMode = "push" } = {}){
      state.view = isValidView(view) ? view : "bracket";
      document.querySelectorAll(".masters-tab").forEach((tab) => {
        const active = tab.dataset.view === state.view;
        tab.dataset.state = active ? "active" : "inactive";
        tab.setAttribute("aria-selected", active ? "true" : "false");
      });
      els.qualifiersPanel.hidden = state.view !== "qualifiers";
      els.bracketPanel.hidden = state.view !== "bracket";
      if(updateUrl) writeViewUrlState(historyMode);
    }

    async function loadMasters(){
      state.loading = true;
      state.error = "";
      renderQualifiers();
      renderMastersBracket();
      try{
        const [qualifierRows, bracketRows, discordIdRows] = await Promise.all([
          fetchSheetRange(MASTERS_SHEET.sheetId, MASTERS_SHEET.qualifiersRange),
          fetchSheetRange(MASTERS_SHEET.sheetId, MASTERS_SHEET.bracketRange),
          fetchSheetRange(MASTERS_SHEET.sheetId, MASTERS_SHEET.discordIdsRange),
        ]);
        state.qualifiers = parseQualifierRows(qualifierRows);
        state.qualifierBracketParticipants = parseQualifierBracketParticipants(qualifierRows);
        state.qualifierBracketMatches = parseQualifierBracketMatches(qualifierRows, state.qualifierBracketParticipants);
        state.bracketMatches = parseMastersBracketMatches(bracketRows, parseBracketDiscordIds(discordIdRows));
        await loadMembers();
      }catch(error){
        console.error("Unable to load World Golf Masters data.", error);
        state.error = error?.message || "Unable to load tournament data.";
        state.qualifiers = [];
        state.qualifierBracketParticipants = [];
        state.qualifierBracketMatches = [];
        state.bracketMatches = [];
      }finally{
        state.loading = false;
        renderQualifiers();
        renderMastersBracket();
      }
    }

    document.querySelectorAll(".masters-tab").forEach((tab) => {
      tab.addEventListener("click", () => setView(tab.dataset.view));
    });
    window.addEventListener("popstate", () => setView(requestedViewFromUrl(), { updateUrl:false }));

    renderMastersBracket();
    setView(requestedViewFromUrl(), { updateUrl:false });
    loadMasters();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#020b18" />
  <link rel="icon" href="/logos/golf.png" />
  <title>Admin | NSS Golf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;650;750;850;900;950&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/dashboard.css?v=20260817-brand-logo" />
</head>
<body>
  <div class="admin-loading" id="adminLoading" role="status" aria-label="Loading admin dashboard">
    <svg class="admin-loading-spinner" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg>
  </div>

  <div class="admin-denied" id="adminDenied" hidden>
    <div class="admin-access-card">
      <img class="admin-access-logo" src="/logos/golf.png" alt="" />
      <h1 class="admin-access-title">Admin</h1>
      <p class="admin-access-copy" id="adminAccessCopy"></p>
      <button class="admin-access-button" id="adminLoginBtn" type="button" hidden>Sign in with Discord</button>
    </div>
  </div>

  <div class="admin-shell" id="adminShell" hidden>
    <aside class="admin-sidebar" id="adminSidebar" aria-label="Admin navigation">
      <a class="admin-brand" href="/admin/">
        <img class="admin-brand-logo" src="/logos/golf.png" alt="" />
        ADMIN DASHBOARD
      </a>

      <nav class="admin-nav">
        <p class="admin-nav-label">Admin</p>
        <button class="admin-nav-parent" id="resultsEditorToggle" type="button" aria-expanded="true" aria-controls="resultsEditorChildren">
          <svg class="admin-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5V4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5Z"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>
          <span>Results Editor</span>
          <svg class="admin-nav-icon admin-nav-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="admin-nav-children" id="resultsEditorChildren"></div>
        <div id="adminSectionLinks"></div>
      </nav>

      <div class="admin-sidebar-footer">
        <a class="admin-nav-item" href="/index.html">
          <svg class="admin-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/><path d="M9 12h12"/></svg>
          <span>Back to NSS Golf</span>
        </a>
      </div>
    </aside>

    <button class="admin-scrim" id="adminScrim" type="button" aria-label="Close sidebar"></button>

    <main class="admin-main">
      <header class="admin-header">
        <button class="admin-sidebar-trigger" id="adminSidebarTrigger" type="button" aria-label="Toggle sidebar" aria-controls="adminSidebar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
        </button>
        <span class="admin-header-separator" aria-hidden="true"></span>
        <div class="admin-breadcrumb" aria-label="Breadcrumb">
          <span class="admin-breadcrumb-group" id="adminBreadcrumbGroup">Admin</span>
          <span class="admin-breadcrumb-separator" aria-hidden="true">/</span>
          <span class="admin-breadcrumb-page" id="adminBreadcrumbPage">Overview</span>
        </div>
        <div class="admin-header-actions" id="adminHeaderActions" hidden>
          <a class="admin-header-link" id="adminPublicPageLink" href="/" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
            <span>VIEW PUBLIC PAGE</span>
          </a>
          <a class="admin-header-link" id="adminGoogleSheetLink" href="https://docs.google.com/spreadsheets/" target="_blank" rel="noopener noreferrer">
            <svg class="admin-google-sheet-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path class="sheet-page" d="M6 2h8l4 4v16H6z"/>
              <path class="sheet-fold" d="M14 2v5h5"/>
              <path class="sheet-grid" d="M9 11h6v7H9zM9 14.5h6M12 11v7"/>
            </svg>
            <span>VIEW GOOGLE SHEET</span>
          </a>
        </div>
      </header>
      <div class="admin-content">
        <div class="admin-frame-loading" id="adminFrameLoading" role="status" aria-label="Loading admin surface">
          <svg class="admin-loading-spinner" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg>
        </div>
        <iframe class="admin-frame" id="adminFrame" title="Admin surface" allow="clipboard-write"></iframe>
      </div>
    </main>
  </div>

  <script type="module" src="/admin/dashboard.js?v=20260817-compact-change-values"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#020B18" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="/logos/golf.png" />
  <title>NSS Golf Community</title>

  <style>
    :root{
      --bg1:#061C3B; --bg2:#04142E; --bg3:#020B18;

      --card-bg: rgba(15,23,42,1);
      --card-shadow: 0 32px 32px rgba(0,0,0,0.65);

      --text: #e9eef8;
      --title: #c7d7ff;
      --muted: #9ca3c7;

      --border-lite: rgba(148,163,184,0.20);
      --btn-bg: rgba(255,255,255,0.06);
      --btn-bg-hover: rgba(255,255,255,0.10);
      --btn-border: rgba(255,255,255,0.15);
      --btn-border-hover: rgba(255,255,255,0.28);
    }

    *{ box-sizing:border-box; }
    [hidden]{ display:none !important; }
    html{
      background-color: var(--bg3);
    }
    body{
      margin:0;
      min-height:100vh;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background-color: var(--bg3);
      background-image: linear-gradient(to bottom, var(--bg1), var(--bg2), var(--bg3));
    }

    .topbar{
      position: sticky; top:0; z-index:10;
      border-bottom: 1px solid rgba(255,255,255,.10);
      background: rgba(3,18,42,.70);
      backdrop-filter: blur(10px);
    }
    .topbar-inner{
      max-width:1100px;
      margin:0 auto;
      padding: 14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }
    .brand{display:flex; gap:12px; align-items:center;}
    .home-badge,
    .home-btn{
      width:40px; height:40px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.05);
      display:grid; place-items:center;
      overflow:hidden;
      user-select:none;
      flex-shrink:0;
    }
    .home-badge img,
    .home-btn img{
      width:70%;
      height:70%;
      object-fit: contain;
      display:block;
      pointer-events:none;
    }

    .kicker{
      font-size:11px;
      letter-spacing:.25em;
      text-transform:uppercase;
      color: rgba(255,255,255,.65);
      font-weight:900;
    }
    .page-nav-select{
      background: rgba(2,6,23,.85);
      color: inherit;
      border: 1px solid rgba(125,211,252,.35);
      border-radius: 10px;
      padding: 6px 32px 6px 10px;
      font: inherit;
      letter-spacing: inherit;
      text-transform: uppercase;
      max-width: min(56vw, 420px);
      cursor: pointer;
    }
    .page-nav-select:focus-visible{
      outline: 2px solid rgba(125,211,252,.6);
      outline-offset: 2px;
    }


    .container{
      max-width:1100px;
      margin:0 auto;
      padding: 16px 18px 56px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap: 16px;
    }

    .card{
      width: min(820px, 100%);
      background: var(--card-bg);
      border-radius: 20px;
      padding: 22px 20px;
      box-shadow: var(--card-shadow);
      border: 1px solid rgba(255,255,255,0.10);
    }
    .leagues-card{
      overflow: hidden;
      padding-left: 0;
      padding-right: 0;
    }
    .leagues-card .league-headline{
      padding-left: 20px;
      padding-right: 20px;
    }

    .headline{
      font-size: 22px;
      font-weight: 950;
      color: var(--title);
      letter-spacing: .035em;
      text-transform: uppercase;
      margin: 0 0 10px 0;
    }

    .league-headline{
      text-align: center;
    }

    .copy{
      margin: 0;
      color: rgba(233,238,248,0.92);
      font-size: 15px;
      line-height: 1.55;
      font-weight: 700;
    }

    .actions{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items:center;
      justify-content: center;
      padding-top: 6px;
    }

    .archive-card{
      text-align:center;
    }

    .archive-actions{
      width: min(520px, 100%);
      margin: 0 auto;
      display:grid;
      gap: 10px;
      align-items:stretch;
      padding-top: 4px;
    }

    .archive-actions .btn{
      width: 100%;
      justify-content:center;
      text-align:center;
    }
    .player-search{
      position:relative;
      width:min(520px, 100%);
      margin: 4px auto 14px;
    }
    .player-search-input{
      appearance:none;
      -webkit-appearance:none;
      width:100%;
      border:1px solid rgba(148,163,184,0.28);
      background: rgba(255,255,255,0.045);
      color: rgba(233,238,248,0.95);
      border-radius: 14px;
      padding: 12px 14px;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      outline: none;
      text-align:left;
    }
    .player-search-input::placeholder{
      color: rgba(156,163,199,0.72);
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: 11px;
      font-weight: 900;
    }
    .player-search-input::-webkit-search-cancel-button{
      -webkit-appearance:none;
      appearance:none;
      width: 14px;
      height: 14px;
      margin-left: 8px;
      background-color: rgba(156,163,199,0.72);
      cursor:pointer;
      -webkit-mask: url("data:image/svg+xml,%3Csvg viewBox='0 0 16 16' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M3.5 3.5 12.5 12.5M12.5 3.5 3.5 12.5' stroke='black' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E") center / 12px 12px no-repeat;
      mask: url("data:image/svg+xml,%3Csvg viewBox='0 0 16 16' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M3.5 3.5 12.5 12.5M12.5 3.5 3.5 12.5' stroke='black' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E") center / 12px 12px no-repeat;
    }
    .player-search-input:focus{
      border-color: rgba(45,212,191,0.62);
      box-shadow: 0 0 0 2px rgba(45,212,191,0.12), 0 0 18px rgba(45,212,191,0.12);
    }
    .player-search-results{
      position:absolute;
      top: calc(100% + 8px);
      left:0;
      right:0;
      z-index: 20;
      display:grid;
      gap: 6px;
      max-height: 292px;
      overflow:auto;
      padding: 8px;
      border:1px solid rgba(148,163,184,0.28);
      border-radius: 14px;
      background: rgba(2,8,24,0.98);
      box-shadow: 0 22px 34px rgba(0,0,0,0.42);
      text-align:left;
    }
    .player-search-results[hidden]{
      display:none;
    }
    .player-search-result{
      appearance:none;
      -webkit-appearance:none;
      border:1px solid transparent;
      background: rgba(255,255,255,0.045);
      color: inherit;
      border-radius: 10px;
      padding: 7px 8px;
      display:flex;
      align-items:center;
      gap: 10px;
      min-width:0;
      cursor:pointer;
      text-align:left;
    }
    .player-search-result:hover,
    .player-search-result:focus-visible{
      background: rgba(255,255,255,0.10);
      border-color: rgba(255,255,255,0.18);
      outline: none;
    }
    .player-search-avatar{
      width: 32px;
      height: 32px;
      border-radius: 999px;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.08);
      flex: 0 0 auto;
    }
    .player-search-copy{
      min-width:0;
      display:flex;
      align-items:baseline;
      gap: 8px;
      flex: 1 1 auto;
    }
    .player-search-display{
      min-width:0;
      color:#fff;
      font-size: 13px;
      font-weight: 950;
      line-height:1.1;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .player-search-username{
      min-width:0;
      color: rgba(156,163,199,0.78);
      font-size: 12px;
      font-weight: 650;
      line-height:1.1;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      flex: 1 1 auto;
    }
    .player-search-empty{
      margin:0;
      padding: 8px 10px;
      color: rgba(156,163,199,0.86);
      font-size: 12px;
      font-weight: 800;
      text-align:center;
    }

    .league-tabs{
      --home-tabs-accent-rgb: 125, 211, 252;
      margin: 16px 0 0;
      width: 100%;
    }

    .home-league-tabs-root{
      width: 100%;
    }

    .home-league-tabs-list{
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0;
      padding: 0;
      border: 0;
      border-bottom: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 0;
      background: transparent;
    }

    .home-league-tabs-trigger{
      position: relative;
      min-height: 35px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: rgba(233, 238, 248, 0.86);
      padding: 6px 8px 7px;
      text-align: center;
      line-height: 1.2;
      font: inherit;
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .06em;
      text-transform: uppercase;
      appearance: none;
      cursor: pointer;
      transition: background-color 140ms ease, color 140ms ease, box-shadow 140ms ease;
    }

    .home-league-tabs-trigger-label{
      display: block;
      width: 100%;
      text-align: center;
    }

    .home-league-tabs-trigger::after{
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      border-radius: 0;
      background: transparent;
      transition: background-color 140ms ease;
    }

    .home-league-tabs-trigger:hover{
      background: rgba(var(--home-tabs-accent-rgb), 0.10);
      color: rgba(255,255,255,0.95);
    }

    .home-league-tabs-trigger[data-state="active"]{
      background: rgba(var(--home-tabs-accent-rgb), 0.12);
      color: #f4fbff;
    }

    .home-league-tabs-trigger[data-state="active"]::after{
      background: rgba(var(--home-tabs-accent-rgb), 0.84);
    }

    .home-league-tabs-trigger:focus-visible{
      outline: none;
      box-shadow: inset 0 0 0 1px rgba(var(--home-tabs-accent-rgb), 0.46);
    }

    .league-section{
      margin-top: 18px;
      text-align: center;
    }

    .league-section[hidden]{
      display: none;
    }

    .league-placeholder{
      margin: 0;
      font-size: 14px;
      color: rgba(233,238,248,0.72);
      font-weight: 600;
    }

    .btn{
      appearance:none;
      -webkit-appearance:none;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: rgba(255,255,255,0.92);
      padding: 12px 14px;
      border-radius: 14px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: .10em;
      font-size: 12px;
      cursor:pointer;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      gap: 8px;
      line-height: 1;
    }
    .btn.neon-red{
      color: #ff5a5a;
      border-color: rgba(255,90,90,0.9);
      box-shadow: 0 0 12px rgba(255,90,90,0.45), 0 0 24px rgba(255,90,90,0.2);
      text-shadow: 0 0 8px rgba(255,90,90,0.9);
    }
    .btn.neon-blue{
      color: #7dd3fc;
      border-color: rgba(125,211,252,0.9);
      box-shadow: 0 0 12px rgba(125,211,252,0.45), 0 0 24px rgba(125,211,252,0.2);
      text-shadow: 0 0 8px rgba(125,211,252,0.9);
    }
    .btn.neon-green{
      color: #5dff9c;
      border-color: rgba(93,255,156,0.9);
      box-shadow: 0 0 12px rgba(93,255,156,0.45), 0 0 24px rgba(93,255,156,0.2);
      text-shadow: 0 0 8px rgba(93,255,156,0.9);
    }
    .btn.neon-yellow{
      color: #f6ff6a;
      border-color: rgba(246,255,106,0.9);
      box-shadow: 0 0 12px rgba(246,255,106,0.45), 0 0 24px rgba(246,255,106,0.2);
      text-shadow: 0 0 8px rgba(246,255,106,0.9);
    }
    .btn.neon-purple{
      color: #d176ff;
      border-color: rgba(209,118,255,0.9);
      box-shadow: 0 0 12px rgba(209,118,255,0.45), 0 0 24px rgba(209,118,255,0.2);
      text-shadow: 0 0 8px rgba(209,118,255,0.9);
    }
    .btn.solid-teal{
      color: #2dd4bf;
      border-color: rgba(45,212,191,0.9);
      box-shadow: 0 0 12px rgba(45,212,191,0.45), 0 0 24px rgba(45,212,191,0.2);
      text-shadow: 0 0 8px rgba(45,212,191,0.9);
    }
    .btn.solid-teal:hover{
      color: #5eead4;
      border-color: rgba(94,234,212,0.95);
      background: var(--btn-bg-hover);
    }
    .btn.indigo{
      color: #818cf8;
      border-color: rgba(129,140,248,0.9);
      box-shadow: 0 0 12px rgba(129,140,248,0.45), 0 0 24px rgba(99,102,241,0.22);
      text-shadow: 0 0 8px rgba(129,140,248,0.9);
    }
    .btn.indigo:hover{
      color: #a5b4fc;
      border-color: rgba(165,180,252,0.95);
      background: var(--btn-bg-hover);
    }
    .btn.gold{
      color: #facc15;
      border-color: rgba(250,204,21,0.9);
      box-shadow: 0 0 12px rgba(250,204,21,0.42), 0 0 24px rgba(234,179,8,0.18);
      text-shadow: 0 0 8px rgba(250,204,21,0.82);
    }
    .btn.gold:hover{
      color: #fde68a;
      border-color: rgba(253,230,138,0.95);
      background: var(--btn-bg-hover);
    }
    .btn.light-green{
      color: #bef264;
      border-color: rgba(190,242,100,0.9);
      box-shadow: 0 0 12px rgba(190,242,100,0.38), 0 0 24px rgba(132,204,22,0.18);
      text-shadow: 0 0 8px rgba(190,242,100,0.78);
    }
    .btn.light-green:hover{
      color: #d9f99d;
      border-color: rgba(217,249,157,0.95);
      background: var(--btn-bg-hover);
    }
    .btn.royal-blue{
      color: #60a5fa;
      border-color: rgba(37,99,235,0.95);
      box-shadow: 0 0 12px rgba(37,99,235,0.48), 0 0 24px rgba(29,78,216,0.24);
      text-shadow: 0 0 8px rgba(96,165,250,0.85);
    }
    .btn.royal-blue:hover{
      color: #93c5fd;
      border-color: rgba(96,165,250,0.95);
      background: var(--btn-bg-hover);
    }
    .btn.neon-gradient{
      border: 1px solid transparent;
      border-image: linear-gradient(90deg, #7dd3fc, #f6ff6a) 1;
      border-radius: 14px;
      background-image: linear-gradient(90deg, #7dd3fc, #f6ff6a);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      box-shadow: 0 0 12px rgba(125,211,252,0.45), 0 0 24px rgba(246,255,106,0.2);
      filter: drop-shadow(0 0 6px rgba(125,211,252,0.5)) drop-shadow(0 0 8px rgba(246,255,106,0.35));
    }
    .btn-icon{
      width: 16px;
      height: 16px;
      display: block;
      fill: currentColor;
    }
    .upcoming-schedule{
      width: min(420px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 10px;
      justify-items: stretch;
      padding-top: 6px;
    }
    .schedule-row{
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
    }
    .schedule-month{
      color: rgba(233,238,248,0.72);
      font-size: 12px;
      font-weight: 950;
      letter-spacing: .12em;
      text-transform: uppercase;
      text-align: right;
    }
    .schedule-row .btn{
      justify-content: center;
      width: 100%;
    }
    .calendar-section{
      margin-top: 0;
    }
    .home-section-title{
      margin: 0;
      padding: 14px 20px 12px;
      color: rgba(199,215,255,0.96);
      font-size: 16px;
      font-weight: 950;
      letter-spacing: .18em;
      line-height: 1.2;
      text-align: center;
      text-transform: uppercase;
    }
    .calendar-pinned-actions{
      width: 100%;
      margin: 0 auto;
      display:grid;
      gap: 0;
      align-items:stretch;
      padding-top: 0;
    }
    .calendar-separator{
      display: none;
    }
    .calendar-view{
      width: 100%;
      margin: 0 auto;
      display: grid;
      gap: 0;
      justify-items: stretch;
    }
    .events-section-title{
      margin-top: 0;
      margin-bottom: 0;
    }
    .calendar-row{
      min-width: 0;
    }
    .calendar-row + .calendar-row .event-span{
      margin-top: -1px;
    }
    .event-span{
      --event-accent: #7dd3fc;
      --event-accent-rgb: 125, 211, 252;
      --event-border-alpha: 0.70;
      position: relative;
      isolation: isolate;
      height: 92px;
      width: 100%;
      overflow: hidden;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 0;
      padding: 0 22px;
      border: 1px solid rgba(var(--event-accent-rgb), var(--event-border-alpha));
      border-left: 0;
      border-right: 0;
      border-radius: 0;
      background: rgba(255,255,255,0.045);
      box-shadow: 0 0 12px rgba(var(--event-accent-rgb),0.26), 0 0 24px rgba(var(--event-accent-rgb),0.10);
    }
    .event-span::before{
      content:"";
      position:absolute;
      inset:0;
      z-index:-2;
      background: linear-gradient(270deg, rgba(var(--event-accent-rgb),0.16) 0%, rgba(var(--event-accent-rgb),0.08) 22%, rgba(var(--event-accent-rgb),0.025) 38%, transparent 58%);
      pointer-events:none;
    }
    .event-span::after{
      content:"";
      position:absolute;
      inset:0;
      z-index:-1;
      background: linear-gradient(90deg, rgba(15,23,42,0.82), rgba(15,23,42,0.30) 58%, rgba(15,23,42,0.12));
      pointer-events:none;
    }
    .event-span.neon-red{ --event-accent:#ff5a5a; --event-accent-rgb:255,90,90; --event-border-alpha:0.90; }
    .event-span.neon-blue{ --event-accent:#7dd3fc; --event-accent-rgb:125,211,252; --event-border-alpha:0.90; }
    .event-span.neon-green{ --event-accent:#5dff9c; --event-accent-rgb:93,255,156; --event-border-alpha:0.90; }
    .event-span.neon-yellow{ --event-accent:#f6ff6a; --event-accent-rgb:246,255,106; --event-border-alpha:0.90; }
    .event-span.neon-purple{ --event-accent:#d176ff; --event-accent-rgb:209,118,255; --event-border-alpha:0.90; }
    .event-span.solid-teal{ --event-accent:#2dd4bf; --event-accent-rgb:45,212,191; --event-border-alpha:0.90; }
    .event-span.indigo{ --event-accent:#818cf8; --event-accent-rgb:129,140,248; --event-border-alpha:0.90; }
    .event-span.gold{ --event-accent:#facc15; --event-accent-rgb:250,204,21; --event-border-alpha:0.90; }
    .event-span.light-green{ --event-accent:#bef264; --event-accent-rgb:190,242,100; --event-border-alpha:0.90; }
    .event-span.royal-blue{ --event-accent:#60a5fa; --event-accent-rgb:96,165,250; --event-border-alpha:0.90; }
    .event-meta{
      position:relative;
      z-index:1;
      width: 118px;
      flex: 0 0 118px;
      color: rgba(233,238,248,0.78);
      font-size: 18px;
      font-weight: 950;
      letter-spacing: .10em;
      line-height: 1.05;
      text-transform: uppercase;
      text-align:left;
    }
    .event-winner-slot{
      --winner-avatar-size: 140px;
      position:relative;
      z-index:1;
      flex: 0 0 240px;
      height: 100%;
      min-width:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 12px 16px;
      overflow:hidden;
      pointer-events:none;
    }
    .event-winner-slot::before{
      display:none;
    }
    .event-winner-slot::after{
      display:none;
    }
    .event-action{
      position:relative;
      z-index:2;
      min-width: 0;
      flex: 0 1 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 10px;
      margin-left:auto;
      padding: 9px 12px;
      border-radius: 12px;
      color: var(--event-accent);
      font-size: 22px;
      font-weight: 950;
      letter-spacing: .08em;
      line-height: 1.05;
      text-align:right;
      text-decoration:none;
      text-shadow: none;
      text-transform: uppercase;
      transition: background-color 140ms ease, color 140ms ease;
    }
    .event-action:hover,
    .event-action:focus-visible{
      background: rgba(var(--event-accent-rgb),0.12);
      color: #fff;
      outline: none;
      text-shadow: none;
    }
    .event-title-text{
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .event-state-icon{
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      display:block;
    }
    .event-state-icon.is-upcoming{
      color: rgba(148,163,184,0.88);
      fill: none;
      stroke: currentColor;
    }
    .event-state-icon.is-finished{

      { year:CURRENT_YEAR, month:4, title:"Lightning Cup", href:"/lightningcup/index.html", className:"neon-yellow", winnerLoader:"lightningCup2026", fallbackWinner:{ name:"Hunter", discordId:"1183051773884248104" } },

    function normalizeSearchText(value){
      return String(value || "").trim();
    }

    function seasonLabelFromConfig(value){
      const text = String(value ?? "").trim();
      const match = text.match(/\d+/);
      return match ? `Season ${match[0]}` : text || "Season";
    }

    function normalizeSearchKey(value){
      return normalizeSearchText(value).toLowerCase();
    }

    function normalizeDiscordId(value){
      return normalizeSearchText(value).replace(/[^\d]/g, "");
    }

    function escapeHtml(value){
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function normalizeNameKey(value){
      return normalizeSearchText(value).toLowerCase().replace(/\s+/g, " ");
    }

    function normalizeProfileLookupKey(value){
      return normalizeNameKey(value).replace(/[^a-z0-9]/g, "");
    }

    function memberDisplayName(member, fallback = ""){
      return normalizeSearchText(member?.display_name) ||
        normalizeSearchText(member?.username) ||
        normalizeSearchText(fallback);
    }

    function winnerAvatarUrlForMember(member){
      return normalizeSearchText(member?.server_avatar_url) || normalizeSearchText(member?.avatar_url);
    }

    function sheetNameEscape(value){
      return String(value || "").replace(/'/g, "''");
    }

    function sheetRange(sheetName, range){
      return `'${sheetNameEscape(sheetName)}'!${range}`;
    }

    function normalizeSheetValues(payload){
      if(Array.isArray(payload)) return payload;
      if(payload?.error) throw new Error(payload.error.message || "Google Sheets request failed.");
      if(Array.isArray(payload?.values)) return payload.values;
      if(Array.isArray(payload?.data?.values)) return payload.data.values;
      if(Array.isArray(payload?.result?.values)) return payload.result.values;
      return [];
    }

    async function fetchSheetRange(sheetId, range){
      const payload = { sheetId, range };

      try{
        const response = await fetch(SHEET_WORKER_URL, {
          ...FETCH_NO_STORE,
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body:JSON.stringify(payload),
        });
        if(response.ok) return normalizeSheetValues(await response.json());
      }catch{
      }

      try{
        const url = new URL(SHEET_WORKER_URL);
        url.searchParams.set("sheetId", sheetId);
        url.searchParams.set("range", range);
        const response = await fetch(url.toString(), FETCH_NO_STORE);
        if(response.ok) return normalizeSheetValues(await response.json());
      }catch{
      }

      return fetchSheetRangeGviz(sheetId, range);
    }

    function parseSheetRange(range){
      const text = normalizeSearchText(range);
      const match = text.match(/^'([^']+)'!(.+)$/) || text.match(/^([^!]+)!(.+)$/);
      if(match) return { sheetName:match[1], a1:match[2] };
      return { sheetName:"", a1:text };
    }

    function parseGvizResponse(text){
      const match = String(text || "").match(/google\.visualization\.Query\.setResponse\((.*)\);?\s*$/s);
      if(!match) throw new Error("Unable to parse Google Sheets response.");
      const payload = JSON.parse(match[1]);
      const rows = payload?.table?.rows ?? [];
      return rows.map(row => (row.c ?? []).map(cell => cell?.v ?? ""));
    }

    async function fetchSheetRangeGviz(sheetId, range){
      const { sheetName, a1 } = parseSheetRange(range);
      const url = new URL(`https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq`);
      url.searchParams.set("tqx", "out:json");
      if(sheetName) url.searchParams.set("sheet", sheetName);
      if(a1) url.searchParams.set("range", a1);
      const response = await fetch(url.toString(), FETCH_NO_STORE);
      if(!response.ok){
        const text = await response.text().catch(() => "");
        throw new Error(`Google Sheets request failed (${response.status}). ${text}`.trim());
      }
      return parseGvizResponse(await response.text());
    }

    async function fetchSheetRanges(sheetId, ranges){
      const payload = { sheetId, ranges };
      try{
        const response = await fetch(SHEET_WORKER_URL, {
          ...FETCH_NO_STORE,
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body:JSON.stringify(payload),
        });
        if(response.ok){
          const payload = await response.json();
          const valueRanges = Array.isArray(payload?.valueRanges) ? payload.valueRanges : [];
          if(valueRanges.length){
            return valueRanges.map(valueRange => normalizeSheetValues(valueRange));
          }
        }
      }catch{
      }

      return Promise.all(ranges.map(range => fetchSheetRange(sheetId, range)));
    }

    async function fetchSheetRangeDirect(sheetId, range){
      const url = new URL(SHEET_WORKER_URL);
      url.searchParams.set("sheetId", sheetId);
      url.searchParams.set("range", range);
      const response = await fetch(url.toString(), FETCH_NO_STORE);
      if(!response.ok) throw new Error(`Sheet request failed (${response.status})`);
      return normalizeSheetValues(await response.json());
    }

    function trophyIconSvg(){
      return `
        <svg class="lucide lucide-trophy event-winner-trophy" viewBox="0 0 24 24" aria-hidden="true" focusable="false" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 14.66v1.626a2 2 0 0 1-.976 1.696A5 5 0 0 0 7 21.978"></path>
          <path d="M14 14.66v1.626a2 2 0 0 0 .976 1.696A5 5 0 0 1 17 21.978"></path>
          <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
          <path d="M4 22h16"></path>
          <path d="M6 9a6 6 0 0 0 12 0V3a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1z"></path>
          <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
        </svg>
      `;
    }

    function stateIndicatorMarkup(kind){
      if(kind === "finished"){
        return "";
      }
      if(kind === "live"){
        return `<span class="event-live-dot" aria-hidden="true"></span>`;
      }
      return `
        <svg class="lucide lucide-clock event-state-icon is-upcoming" viewBox="0 0 24 24" aria-hidden="true" focusable="false" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
      `;
    }

    function eventBaseStatus(event){
      if(event.status === "live") return "live";
      if(event.year < CURRENT_YEAR) return "past";
      if(event.year > CURRENT_YEAR) return "upcoming";
      if(event.month <= CURRENT_MONTH_INDEX) return "live";
      return "upcoming";
    }

    function eventStateKind(event, winner = null){
      if(winner?.name) return "finished";
      return eventBaseStatus(event) === "live" ? "live" : "upcoming";
    }

    function eventWinnerMarkup(winner = null){
      if(!winner?.name) return "";
      const avatar = normalizeSearchText(winner.avatarUrl);

        ? `<img class="event-winner-portrait" src="${escapeHtml(avatar)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" />`
        : "";

        <span class="event-winner-slot">
          ${portraitMarkup}
          <span class="event-winner">
            ${trophyIconSvg()}
            <span class="event-winner-name">${displayName}</span>
          </span>
        </span>
      `;
    }

    function eventMetaLabel(event){
      return MONTH_LABELS[event.month] || "";
    }

    function calendarEventId(event){
      return `calendar-event-${event.year}-${event.month}-${event.title.toLowerCase().replace(/[^a-z0-9]+/g, "-")}`;
    }

    function calendarRowMarkup(event, winner = null){
      const resolvedWinner = winner || event.fallbackWinner || null;
      const stateKind = eventStateKind(event, resolvedWinner);
      return `
        <div class="calendar-row" id="${calendarEventId(event)}" data-winner-loader="${escapeHtml(event.winnerLoader || "")}">
          <span class="event-span ${escapeHtml(event.className)} is-${escapeHtml(stateKind)}">
            <span class="event-meta">${escapeHtml(eventMetaLabel(event))}</span>
            ${eventWinnerMarkup(resolvedWinner)}
            <a class="event-action" href="${escapeHtml(event.href)}" aria-label="Go to ${escapeHtml(event.title)}">
              <span class="event-title-text">${escapeHtml(event.title)}</span>
              ${stateIndicatorMarkup(stateKind)}
            </a>
          </span>
        </div>
      `;
    }

    function renderCalendarYear(yearValue){
      activeCalendarYear = String(yearValue);
      if(calendarSection){
        calendarSection.setAttribute("aria-labelledby", `year-tab-${activeCalendarYear}`);
      }
      if(!calendarView) return;
      const year = Number(yearValue);
      const events = CALENDAR_EVENTS
        .filter(event => event.year === year)
        .sort((left, right) => left.month - right.month || left.title.localeCompare(right.title));

      calendarView.innerHTML = events.length
        ? events.map(calendarRowMarkup).join("")
        : `<p class="league-placeholder">No tournaments listed for ${escapeHtml(yearValue)}.</p>`;

      events.forEach((event) => {
        void hydrateEventWinner(event);
      });
    }

    function initLeagueTabs(){
      renderCalendarYear(activeCalendarYear);
      if(!leagueTabsEl) return;
      mountHomeLeagueTabs(leagueTabsEl, {
        tabs: CALENDAR_TABS,
        initialTab: activeCalendarYear,
        onTabChange: renderCalendarYear,
      });
    }

    function updateEventRow(event, winner){
      const row = document.getElementById(calendarEventId(event));
      if(!row) return;
      row.outerHTML = calendarRowMarkup(event, winner);
    }

    async function hydrateEventWinner(event){
      if(!event.winnerLoader || !WINNER_LOADERS[event.winnerLoader]) return;
      try{
        if(!winnerCache.has(event.winnerLoader)){
          winnerCache.set(event.winnerLoader, Promise.resolve(WINNER_LOADERS[event.winnerLoader]()).catch(() => null));
        }
        const loadedWinner = await winnerCache.get(event.winnerLoader);
        const winner = loadedWinner
          ? { ...(event.fallbackWinner || {}), ...loadedWinner }
          : event.fallbackWinner;
        if(String(event.year) !== activeCalendarYear) return;
        if(winner?.name){
          updateEventRow(event, await enrichWinnerProfile(winner));
        }
      }catch{
        // Keep the deterministic month-based status if a tournament source is unavailable.
      }
    }

    async function enrichWinnerProfile(winner){
      const discordId = normalizeDiscordId(winner?.discordId);
      const lookupKeys = [
        winner?.name,
        winner?.displayName,
        winner?.username,
        ...(Array.isArray(winner?.aliases) ? winner.aliases : []),
      ].map(normalizeNameKey).filter(Boolean);
      const compactLookupKeys = lookupKeys.map(normalizeProfileLookupKey).filter(Boolean);
      let member = null;

      if(discordId){
        try{
          const { data } = await supabase
            .from("discord_guild_members")
            .select("discord_user_id,username,display_name,server_avatar_url,avatar_url")
            .eq("discord_user_id", discordId)
            .maybeSingle();
          member = data || null;
        }catch{
          member = null;
        }
      }

      if(!member && lookupKeys.length){
        try{
          const rows = await loadMemberSearchRows();
          member = rows.find(row => (
            lookupKeys.includes(normalizeNameKey(row.username)) ||
            lookupKeys.includes(normalizeNameKey(row.display_name))
          )) || rows.find(row => (
            compactLookupKeys.includes(normalizeProfileLookupKey(row.username)) ||
            compactLookupKeys.includes(normalizeProfileLookupKey(row.display_name))
          )) || null;
        }catch{
          member = null;
        }
      }

      return {
        ...winner,
        displayName: memberDisplayName(member, winner.name),
        discordId: normalizeDiscordId(member?.discord_user_id) || discordId,
        avatarUrl: winnerAvatarUrlForMember(member) || winner.avatarUrl || "",
      };
    }

    function orderedMatchTeams(match){
      return [match?.team1, match?.team2].map(team => normalizeSearchText(team)).filter(Boolean);
    }

    function worldCupMatchWinner(match, fallbackToSheetOrder = false){
      const teams = orderedMatchTeams(match);
      if(teams.length < 2) return "";
      const first = getWorldCupMatchOutcome(match, teams[0]);
      const second = getWorldCupMatchOutcome(match, teams[1]);
      if(first?.outcome === "win") return teams[0];
      if(second?.outcome === "win") return teams[1];
      return fallbackToSheetOrder ? teams[0] : "";
    }

    async function loadWorldCupWinner(year){
      const data = parseWorldCupSheet(await fetchWorldCupValues(year), { year });
      const finalMatch = (data.bracket || []).find(match => {
        const round = normalizeSearchText(match.round);
        return round === "F" || /^final$/i.test(round);
      });
      const winner = worldCupMatchWinner(finalMatch, true);
      if(!winner) return null;
      return {
        name:winner,
        displayName:winner,
        avatarUrl:`/assets/flag-icons/4x3/${worldCupFlagForTeam(winner)}.svg`,
      };
    }

    async function loadWorldOpenWinner(){
      const sheetId = "1WcRVGmEpQkRDTwe8aDfQgxuDoapvLxAdSjnqg4PHgXM";
      const [championRows, discordRows] = await Promise.all([
        fetchSheetRange(sheetId, sheetRange("2026 Results", "AX2:AX2")),
        fetchSheetRange(sheetId, sheetRange("Discord IDs", "A:B")).catch(() => []),
      ]);
      const name = normalizeSearchText(championRows?.[0]?.[0]);
      if(!name) return null;
      const discordId = (discordRows || []).find(row => normalizeNameKey(row?.[0]) === normalizeNameKey(name))?.[1] || "";
      return { name, discordId };
    }

    async function loadLightningCupWinner(){
      const sheetId = "1nqZpVdf8bRlNAS-a16HeW5Lp9za5bKT18GofnXI7FXQ";
      const [bracketRows, seedsRows] = await Promise.all([
        fetchSheetRange(sheetId, "'Bracket'!A:T"),
        fetchSheetRange(sheetId, "'Seeds'!C:E").catch(() => []),
      ]);
      const finalRow = (bracketRows || []).slice(1).find(row => /^final$/i.test(normalizeSearchText(row?.[1])));
      const name = normalizeSearchText(finalRow?.[9]);
      if(!name) return null;
      const seedRow = (seedsRows || []).find(row => normalizeNameKey(row?.[0]) === normalizeNameKey(name));
      return { name, discordId:normalizeDiscordId(seedRow?.[2]) };
    }

    function parseNoptationalScore(value){
      const raw = normalizeSearchText(value);
      if(!raw) return null;
      if(/^e$/i.test(raw)) return 0;
      const cleaned = raw.replace(/[^\d.+-]/g, "");
      if(!cleaned || cleaned === "+" || cleaned === "-") return null;
      const number = Number(cleaned);
      return Number.isFinite(number) ? number : null;
    }

    function noptationalDisplayParts(rawName){
      const lines = String(rawName || "").split(/\n+/).map(normalizeSearchText).filter(Boolean);
      if(lines.length > 1){
        return {
          display:normalizeSearchText(lines[0]),
          username:normalizeSearchText(lines[1]),
        };
      }
      const text = normalizeSearchText(lines[0] || rawName);
      const match = text.match(/^(.*?)\s*\(([^)]+)\)\s*$/);
      return {
        display:normalizeSearchText(match ? match[1] : text),
        username:normalizeSearchText(match ? match[2] : ""),
      };
    }

    async function loadNoptationalWinner(){
      const sheetId = "1T7kmgUtimrOW3LaTw2hYLMFvO600SjmUDLTecL6gY00";
      const courses = [
        { minimum:-12, columns:[1, 2] },
        { minimum:-10, columns:[3, 4] },
        { minimum:-3, columns:[5, 6, 7] },
        { minimum:-22, columns:[8, 9] },
      ];
      const rows = await fetchSheetRange(sheetId, sheetRange("Round Scores (2026)", "A1:J250"));
      const players = (rows || []).slice(1).map((row) => {
        const { display, username } = noptationalDisplayParts(row?.[0]);
        if(!display) return null;
        let total = 0;
        let countedCount = 0;
        let cut = false;
        courses.forEach((course) => {
          const scores = course.columns.map(column => parseNoptationalScore(row?.[column])).filter(score => score !== null);
          total += scores.reduce((sum, score) => sum + score, 0);
          countedCount += scores.length;
          if(scores.length && Math.min(...scores) > course.minimum) cut = true;
        });
        return { display, username, total, countedCount, cut };
      }).filter(player => player && player.countedCount > 0 && !player.cut)
        .sort((left, right) => left.total - right.total || right.countedCount - left.countedCount || left.display.localeCompare(right.display));
      const winner = players[0];
      if(!winner) return null;
      const memberRows = await loadMemberSearchRows().catch(() => []);
      const member = memberRows.find(row => normalizeNameKey(row.username) === normalizeNameKey(winner.username)) || null;
      return { name:winner.display, username:winner.username, discordId:member?.discord_user_id || "" };
    }

    function parseSuperLeaguePlayoffRows(values){
      return (values || []).map((row = []) => ({
        p1:{ name:normalizeSearchText(row[3]), result:normalizeSearchText(row[10]).toUpperCase() },
        p2:{ name:normalizeSearchText(row[12]), result:normalizeSearchText(row[19]).toUpperCase() },
      }));
    }

    async function loadSuperLeagueWinner(sheetName){
      const sheetId = "1BbT8t6erCVdx-Bdshv_hax9r9JSRzU1WygjWxW3vPkY";
      const [playoffRows, discordRows] = await Promise.all([
        fetchSheetRange(sheetId, sheetRange(sheetName, "I87:AB92")),
        fetchSheetRange(sheetId, sheetRange("Discord IDs", "A:B")).catch(() => []),
      ]);
      const championship = parseSuperLeaguePlayoffRows(playoffRows)[2];
      const name = championship?.p1?.result === "W" ? championship.p1.name
        : championship?.p2?.result === "W" ? championship.p2.name
        : "";
      if(!name) return null;
      const discordId = (discordRows || []).find(row => normalizeNameKey(row?.[1]) === normalizeNameKey(name))?.[0] || "";
      return { name, discordId };
    }

    function parseChampionshipBracketWinner(row){
      const topName = normalizeSearchText(row?.[3]);
      const topScore = Number(row?.[4]);
      const bottomName = normalizeSearchText(row?.[15]);
      const bottomScore = Number(row?.[16]);
      if(!topName || !bottomName || !Number.isFinite(topScore) || !Number.isFinite(bottomScore) || topScore === bottomScore) return "";
      return topScore > bottomScore ? topName : bottomName;
    }

    async function loadWorldChampionshipWinner(){
      const sheetId = "10nVyu3uM_PbK6fDgmomtjlHakNJ1oIM66MRXXHX3k_Q";
      const [fieldRows, bracketRows] = await Promise.all([
        fetchSheetRange(sheetId, "'Field'!B:C").catch(() => []),
        fetchSheetRange(sheetId, "'Bracket'!A:Z"),
      ]);
      const finalRow = (bracketRows || []).find(row => /^final$/i.test(normalizeSearchText(row?.[1])));
      const name = parseChampionshipBracketWinner(finalRow);
      if(!name) return null;
      const discordId = (fieldRows || []).find(row => normalizeNameKey(row?.[0]) === normalizeNameKey(name))?.[1] || "";
      return { name, discordId };
    }

    initLeagueTabs();

    function getDiscordIdentity(user){
      const identities = Array.isArray(user?.identities) ? user.identities : [];
      return identities.find(identity => normalizeSearchText(identity?.provider).toLowerCase() === "discord") || null;
    }

    function getDiscordIdFromUser(user){
      const identity = getDiscordIdentity(user);
      return normalizeDiscordId(
        identity?.provider_id ||
        identity?.identity_data?.provider_id ||
        identity?.identity_data?.sub ||
        identity?.identity_data?.id ||
        user?.user_metadata?.provider_id ||
        user?.user_metadata?.sub
      );
    }

    function setDiscordInviteVisible(isVisible){
      discordInviteEls.forEach((el) => {
        el.hidden = !isVisible;
      });
    }

    async function getProfileDiscordId(user){
      if(!user?.id) return "";

      try{
        const { data, error } = await supabase
          .from("profiles")
          .select("discord_user_id")
          .eq("user_id", user.id)
          .maybeSingle();
        if(error) return "";
        return normalizeDiscordId(data?.discord_user_id);
      }catch{
        return "";
      }
    }

    async function userHasDiscordMemberRecord(user){
      const discordId = normalizeDiscordId(await getProfileDiscordId(user)) || getDiscordIdFromUser(user);
      if(!discordId) return false;

      try{
        const { data, error } = await supabase
          .from("discord_guild_members")
          .select("discord_user_id")
          .eq("discord_user_id", discordId)
          .eq("is_current_member", true)
          .maybeSingle();
        if(error) return false;
        return !!data;
      }catch{
        return false;
      }
    }

    async function updateDiscordInviteVisibility(){
      try{
        const { data: sessionData } = await supabase.auth.getSession();
        if(!sessionData?.session?.user){
          setDiscordInviteVisible(true);
          return;
        }

        let user = sessionData.session.user;
        try{
          const { data: userData, error } = await supabase.auth.getUser();
          if(!error && userData?.user?.id === user.id){
            user = userData.user;
          }
        }catch{
          // Session user is enough for the membership check fallback.
        }

        setDiscordInviteVisible(!(await userHasDiscordMemberRecord(user)));
      }catch{
        setDiscordInviteVisible(true);
      }
    }

    function avatarUrlForMember(member){
      return member?.server_avatar_url || member?.avatar_url || "/logos/golf.png";
    }

    async function loadMemberSearchRows(){
      if(memberSearchRows.length) return memberSearchRows;
      if(memberSearchPromise) return memberSearchPromise;

      memberSearchPromise = (async () => {
        const rows = [];
        for(let from = 0;; from += MEMBER_PAGE_SIZE){
          const to = from + MEMBER_PAGE_SIZE - 1;
          const { data, error } = await supabase
            .from("discord_guild_members")
            .select("discord_user_id,username,display_name,server_avatar_url,avatar_url")
            .eq("is_current_member", true)
            .range(from, to);

          if(error) throw error;
          rows.push(...(data || []));
          if(!data || data.length < MEMBER_PAGE_SIZE) break;
        }

        memberSearchRows = rows
          .filter(member => normalizeSearchText(member?.discord_user_id))
          .map((member) => ({
            ...member,
            displaySearch: normalizeSearchKey(member.display_name),
            usernameSearch: normalizeSearchKey(member.username),
          }));
        return memberSearchRows;
      })().finally(() => {
        memberSearchPromise = null;
      });

      return memberSearchPromise;
    }

    function scoreMemberSearchResult(member, query){
      const display = member.displaySearch;
      const username = member.usernameSearch;
      if(!query) return 0;
      if(display === query) return 120;
      if(username === query) return 110;
      if(display.startsWith(query)) return 95;
      if(username.startsWith(query)) return 85;
      if(display.includes(query)) return 65;
      if(username.includes(query)) return 55;
      return 0;
    }

    function hidePlayerSearchResults(){
      playerSearchResults.hidden = true;
      playerSearchInput.setAttribute("aria-expanded", "false");
    }

    function showPlayerSearchResults(){
      playerSearchResults.hidden = false;
      playerSearchInput.setAttribute("aria-expanded", "true");
    }

    function renderPlayerSearchResults(results, query){
      playerSearchResults.innerHTML = "";

      if(!query){
        hidePlayerSearchResults();
        return;
      }

      if(!results.length){
        const empty = document.createElement("p");
        empty.className = "player-search-empty";
        empty.textContent = "No players found.";
        playerSearchResults.appendChild(empty);
        showPlayerSearchResults();
        return;
      }

      for(const member of results){
        const button = document.createElement("button");
        button.className = "player-search-result";
        button.type = "button";
        button.dataset.playerId = member.discord_user_id;

        const avatar = document.createElement("img");
        avatar.className = "player-search-avatar";
        avatar.src = avatarUrlForMember(member);
        avatar.alt = "";
        avatar.loading = "lazy";
        avatar.decoding = "async";
        avatar.referrerPolicy = "no-referrer";

        const copy = document.createElement("span");
        copy.className = "player-search-copy";

        const displayName = document.createElement("span");
        displayName.className = "player-search-display";
        displayName.textContent = normalizeSearchText(member.display_name) || normalizeSearchText(member.username) || member.discord_user_id;

        const username = document.createElement("span");
        username.className = "player-search-username";
        username.textContent = normalizeSearchText(member.username) || member.discord_user_id;

        copy.append(displayName, username);
        button.append(avatar, copy);
        playerSearchResults.appendChild(button);
      }

      showPlayerSearchResults();
    }

    async function updatePlayerSearch(){
      const query = normalizeSearchKey(playerSearchInput.value);
      if(!query){
        hidePlayerSearchResults();
        return;
      }

      try{
        const rows = await loadMemberSearchRows();
        const results = rows
          .map(member => ({ member, score: scoreMemberSearchResult(member, query) }))
          .filter(result => result.score > 0)
          .sort((left, right) => {
            if(right.score !== left.score) return right.score - left.score;
            return normalizeSearchText(left.member.display_name || left.member.username)
              .localeCompare(normalizeSearchText(right.member.display_name || right.member.username));
          })
          .slice(0, PLAYER_SEARCH_LIMIT)
          .map(result => result.member);
        renderPlayerSearchResults(results, query);
      }catch(error){
        console.error(error);
        playerSearchResults.innerHTML = "";
        const empty = document.createElement("p");
        empty.className = "player-search-empty";
        empty.textContent = "Could not load players.";
        playerSearchResults.appendChild(empty);
        showPlayerSearchResults();
      }
    }

    playerSearchInput.addEventListener("focus", () => {
      void loadMemberSearchRows();
      void updatePlayerSearch();
    });

    playerSearchInput.addEventListener("input", () => {
      void updatePlayerSearch();
    });

    playerSearchResults.addEventListener("click", (event) => {
      const result = event.target.closest(".player-search-result[data-player-id]");
      if(!result) return;
      window.location.href = `/player.html?id=${encodeURIComponent(result.dataset.playerId)}`;
    });

    document.addEventListener("click", (event) => {
      if(playerSearchEl.contains(event.target)) return;
      hidePlayerSearchResults();
    });

    void updateDiscordInviteVisibility();
    supabase.auth.onAuthStateChange(() => {
      void updateDiscordInviteVisibility();
    });
  </script>
  <script type="module" src="/site-topbar.js"></script>
</body>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#020B18" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="/logos/golf.png" />
  <title>NSS Golf Community</title>

  <style>
    :root{
      --bg1:#061C3B; --bg2:#04142E; --bg3:#020B18;
      --page-width: 1100px;

      --card-bg: rgba(15,23,42,1);
      --card-shadow: 0 32px 32px rgba(0,0,0,0.65);

      --text: #e9eef8;
      --title: #c7d7ff;
      --muted: #9ca3c7;

      --border-lite: rgba(148,163,184,0.20);
      --btn-bg: rgba(255,255,255,0.06);
      --btn-bg-hover: rgba(255,255,255,0.10);
      --btn-border: rgba(255,255,255,0.15);
      --btn-border-hover: rgba(255,255,255,0.28);
    }

    *{ box-sizing:border-box; }
    [hidden]{ display:none !important; }
    html{
      background-color: var(--bg3);
    }
    body{
      margin:0;
      min-height:100vh;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background-color: var(--bg3);
      background-image: linear-gradient(to bottom, var(--bg1), var(--bg2), var(--bg3));
    }

    .topbar{
      position: sticky; top:0; z-index:10;
      border-bottom: 1px solid rgba(255,255,255,.10);
      background: rgba(3,18,42,.70);
      backdrop-filter: blur(10px);
    }
    .topbar-inner{
      max-width:var(--page-width);
      margin:0 auto;
      padding: 14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }
    .brand{display:flex; gap:12px; align-items:center;}
    .home-badge,
    .home-btn{
      width:40px; height:40px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.05);
      display:grid; place-items:center;
      overflow:hidden;
      user-select:none;
      flex-shrink:0;
    }
    .home-badge img,
    .home-btn img{
      width:70%;
      height:70%;
      object-fit: contain;
      display:block;
      pointer-events:none;
    }

    .kicker{
      font-size:11px;
      letter-spacing:.25em;
      text-transform:uppercase;
      color: rgba(255,255,255,.65);
      font-weight:900;
    }
    .page-nav-select{
      background: rgba(2,6,23,.85);
      color: inherit;
      border: 1px solid rgba(125,211,252,.35);
      border-radius: 10px;
      padding: 6px 32px 6px 10px;
      font: inherit;
      letter-spacing: inherit;
      text-transform: uppercase;
      max-width: min(56vw, 420px);
      cursor: pointer;
    }
    .page-nav-select:focus-visible{
      outline: 2px solid rgba(125,211,252,.6);
      outline-offset: 2px;
    }


    .container{
      --home-divider-offset: 0px;
      width: min(var(--page-width), 100%);
      margin:0 auto;
      padding: 0 18px 48px;
      display:grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      align-items:start;
      gap: 0;
      background-image: linear-gradient(rgba(148,163,184,0.20), rgba(148,163,184,0.20));
      background-repeat: no-repeat;
      background-size: 1px calc(100% - var(--home-divider-offset));
      background-position: calc(100% - 18px - 320px) var(--home-divider-offset);
    }

    .container:has(.home-discord-invite.is-visible){
      --home-divider-offset: 48px;
    }

    .card{
      width: 100%;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 22px 20px;
      box-shadow: var(--card-shadow);
      border: 1px solid rgba(255,255,255,0.10);
    }
    .leagues-card{
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      overflow: hidden;
      padding-left: 0;
      padding-right: 0;
      padding-top: 0;
      padding-bottom: 0;
    }
    .leagues-card .league-headline{
      padding-left: 12px;
      padding-right: 12px;
    }

    .headline{
      font-size: 22px;
      font-weight: 950;
      color: var(--title);
      letter-spacing: .035em;
      text-transform: uppercase;
      margin: 0 0 10px 0;
    }

    .league-headline{
      text-align: left;
    }

    .copy{
      margin: 0;
      color: rgba(233,238,248,0.92);
      font-size: 15px;
      line-height: 1.55;
      font-weight: 700;
    }

    .actions{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items:center;
      justify-content: center;
      padding-top: 6px;
    }

    .archive-card{
      align-self: stretch;
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      padding: 0;
      text-align:left;
      overflow: hidden;
    }

    .archive-actions{
      width: 100%;
      margin: 0;
      display:grid;
      gap: 10px;
      align-items:stretch;
      padding-top: 0;
    }

    .archive-actions .btn{
      width: 100%;
      justify-content:center;
      text-align:center;
    }
    .player-search{
      position:relative;
      width:min(520px, 100%);
      margin: 4px auto 14px;
    }
    .player-search-input{
      appearance:none;
      -webkit-appearance:none;
      width:100%;
      border:1px solid rgba(148,163,184,0.28);
      background: rgba(255,255,255,0.045);
      color: rgba(233,238,248,0.95);
      border-radius: 14px;
      padding: 12px 14px;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      outline: none;
      text-align:left;
    }
    .player-search-input::placeholder{
      color: rgba(156,163,199,0.72);
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: 11px;
      font-weight: 900;
    }
    .player-search-input::-webkit-search-cancel-button{
      -webkit-appearance:none;
      appearance:none;
      width: 14px;
      height: 14px;
      margin-left: 8px;
      background-color: rgba(156,163,199,0.72);
      cursor:pointer;
      -webkit-mask: url("data:image/svg+xml,%3Csvg viewBox='0 0 16 16' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M3.5 3.5 12.5 12.5M12.5 3.5 3.5 12.5' stroke='black' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E") center / 12px 12px no-repeat;
      mask: url("data:image/svg+xml,%3Csvg viewBox='0 0 16 16' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M3.5 3.5 12.5 12.5M12.5 3.5 3.5 12.5' stroke='black' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E") center / 12px 12px no-repeat;
    }
    .player-search-input:focus{
      border-color: rgba(45,212,191,0.62);
      box-shadow: 0 0 0 2px rgba(45,212,191,0.12), 0 0 18px rgba(45,212,191,0.12);
    }
    .player-search-results{
      position:absolute;
      top: calc(100% + 8px);
      left:0;
      right:0;
      z-index: 20;
      display:grid;
      gap: 6px;
      max-height: 292px;
      overflow:auto;
      padding: 8px;
      border:1px solid rgba(148,163,184,0.28);
      border-radius: 14px;
      background: rgba(2,8,24,0.98);
      box-shadow: 0 22px 34px rgba(0,0,0,0.42);
      text-align:left;
    }
    .player-search-results[hidden]{
      display:none;
    }
    .player-search-result{
      appearance:none;
      -webkit-appearance:none;
      border:1px solid transparent;
      background: rgba(255,255,255,0.045);
      color: inherit;
      border-radius: 10px;
      padding: 7px 8px;
      display:flex;
      align-items:center;
      gap: 10px;
      min-width:0;
      cursor:pointer;
      text-align:left;
    }
    .player-search-result:hover,
    .player-search-result:focus-visible{
      background: rgba(255,255,255,0.10);
      border-color: rgba(255,255,255,0.18);
      outline: none;
    }
    .player-search-avatar{
      width: 32px;
      height: 32px;
      border-radius: 999px;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.08);
      flex: 0 0 auto;
    }
    .player-search-copy{
      min-width:0;
      display:flex;
      align-items:baseline;
      gap: 8px;
      flex: 1 1 auto;
    }
    .player-search-display{
      min-width:0;
      color:#fff;
      font-size: 13px;
      font-weight: 950;
      line-height:1.1;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .player-search-username{
      min-width:0;
      color: rgba(156,163,199,0.78);
      font-size: 12px;
      font-weight: 650;
      line-height:1.1;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      flex: 1 1 auto;
    }
    .player-search-empty{
      margin:0;
      padding: 8px 10px;
      color: rgba(156,163,199,0.86);
      font-size: 12px;
      font-weight: 800;
      text-align:center;
    }

    .home-discord-invite{
      grid-column: 1 / -1;
      display:flex;
      justify-content:center;
      width: calc(100% + 36px);
      margin: -48px -18px 0;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: margin-top 240ms ease, opacity 180ms ease, visibility 0s linear 240ms;
    }
    .home-discord-invite.is-visible{
      margin-top: 0;
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition-delay: 0s;
    }

    .home-primary-tabs{
      grid-column: 1 / -1;
      display:none;
      width: 100%;
    }

    .home-main-column,
    .home-rail{
      min-width:0;
    }

    .home-main-column{
      padding-top: 14px;
    }

    .home-rail{
      margin-top: 14px;
    }

    .rail-block{
      border-bottom: 1px solid rgba(148,163,184,0.20);
      background: transparent;
    }

    .rail-block:last-child{
      border-bottom: 0;
    }

    .rail-heading{
      margin: 0;
      padding: 0 0 10px 12px;
      border-bottom: 0;
      background: transparent;
      color: var(--title);
      font-size: 22px;
      font-weight: 950;
      letter-spacing: .035em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .rail-band{
      --rail-accent:#2dd4bf;
      --rail-accent-rgb:45,212,191;
      min-height: 48px;
      width: 100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 10px 12px;
      border: 0;
      border-bottom: 1px solid rgba(var(--rail-accent-rgb),0.62);
      background:
        linear-gradient(90deg, rgba(15,23,42,0.92), rgba(var(--rail-accent-rgb),0.12)),
        rgba(255,255,255,0.035);
      color: var(--rail-accent);
      font-size: 13px;
      font-weight: 950;
      letter-spacing: .08em;
      line-height: 1.05;
      text-align:center;
      text-decoration:none;
      text-transform: uppercase;
    }

    .rail-band:hover,
    .rail-band:focus-visible{
      background:
        linear-gradient(90deg, rgba(15,23,42,0.88), rgba(var(--rail-accent-rgb),0.18)),
        rgba(255,255,255,0.06);
      color: #fff;
      outline: none;
    }

    .rail-band.gpi-band{
      --rail-accent:#5dff9c;
      --rail-accent-rgb:93,255,156;
      justify-content:center;
      text-align:center;
    }

    .home-gpi-date{
      margin:0;
      padding:9px 10px 8px;
      border-bottom:1px solid rgba(148,163,184,0.12);
      color:rgba(156,163,199,0.82);
      font-size:10px;
      font-weight:850;
      letter-spacing:.04em;
      line-height:1.2;
      text-align:center;
      text-transform:uppercase;
    }

    .records-summary-table{
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .records-summary-table th,
    .records-summary-table td{
      border-right: 1px solid rgba(148,163,184,0.16);
      padding: 8px 6px;
      text-align:center;
      vertical-align:middle;
    }

    .records-summary-table th:last-child,
    .records-summary-table td:last-child{
      border-right: 0;
    }

    .records-summary-table th{
      padding-top: 14px;
      padding-bottom: 3px;
      color: rgba(156,163,199,0.90);
      font-size: 10px;
      font-weight: 950;
      letter-spacing: .08em;
      line-height: 1;
      text-transform: uppercase;
    }

    .records-summary-table td{
      color: rgba(255,255,255,0.94);
      padding-top: 2px;
      padding-bottom: 14px;
      font-size: 22px;
      font-weight: 950;
      letter-spacing: .01em;
      line-height: 1.1;
    }

    .records-summary-suffix{
      font-size: 0.54em;
      line-height: 1;
      letter-spacing: .02em;
      text-transform: uppercase;
    }

    .home-gpi-list{
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .home-gpi-row{
      display:grid;
      grid-template-columns: 46px minmax(0, 1fr) 56px;
      align-items:center;
      gap: 6px;
      min-height: 36px;
      padding: 5px 8px;
      border-bottom: 1px solid rgba(148,163,184,0.12);
      color: inherit;
      text-decoration:none;
    }

    .home-gpi-row:last-child{
      border-bottom: 0;
    }

    .home-gpi-row:hover,
    .home-gpi-row:focus-visible{
      background: rgba(255,255,255,0.055);
      outline: none;
    }

    .home-gpi-rank{
      color: rgba(156,163,199,0.86);
      font-size: 11px;
      font-weight: 950;
      text-align:center;
    }

    .home-gpi-rank-value,
    .home-gpi-rank-number,
    .home-gpi-rank-delta{
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .home-gpi-rank-value{
      display:grid;
      grid-template-columns:18px 28px;
      width:46px;
    }
    .home-gpi-rank-delta{
      min-height:12px;
      gap:0;
      padding-left:2px;
      font-size:9px;
    }
    .home-gpi-rank-delta.is-up{ color:#22c55e; }
    .home-gpi-rank-delta.is-down{ color:#ef4444; }
    .home-gpi-rank-delta.is-flat{ color:rgba(156,163,199,.72); }
    .home-gpi-rank-delta .lucide{ width:9px; height:9px; stroke-width:3; }

    .home-gpi-player{
      min-width:0;
      display:flex;
      align-items:center;
      gap: 7px;
    }

    .home-gpi-avatar{
      width: 24px;
      height: 24px;
      border-radius: 999px;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08);
      flex: 0 0 auto;
    }

    .home-gpi-name{
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      color: rgba(255,255,255,0.94);
      font-size: 12px;
      font-weight: 900;
      line-height: 1.1;
    }

    .home-gpi-rating{
      color: rgba(156,163,199,0.86);
      font-size: 11px;
      font-weight: 950;
      text-align:right;
    }

    .home-gpi-view-all{
      min-height: 38px;
      display:flex;
      align-items:center;
      justify-content:center;
      color: rgba(156,163,199,0.86);
      font-size: 11px;
      font-weight: 950;
      letter-spacing: .12em;
      text-align:center;
      text-decoration:none;
    }

    .home-gpi-view-all:hover,
    .home-gpi-view-all:focus-visible{
      background: rgba(255,255,255,0.055);
      color: rgba(233,238,248,0.96);
      outline: none;
    }

    .rail-empty{
      margin: 0;
      padding: 12px;
      color: rgba(156,163,199,0.84);
      font-size: 12px;
      font-weight: 750;
      line-height: 1.35;
      text-align:center;
    }

    .rail-search{
      padding: 12px;
    }

    .rail-heading + .rail-search{
      padding-top: 0;
    }

    .rail-search .player-search{
      width: 100%;
      margin: 0;
    }

    .league-tabs{
      --home-tabs-accent-rgb: 125, 211, 252;
      margin: 0;
      width: 100%;
    }

    .home-league-tabs-root{
      width: 100%;
    }

    .home-league-tabs-list{
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0;
      padding: 0;
      border: 0;
      border-bottom: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 0;
      background: transparent;
    }

    .home-league-tabs-trigger{
      position: relative;
      min-height: 35px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: rgba(233, 238, 248, 0.86);
      padding: 6px 8px 7px;
      text-align: center;
      line-height: 1.2;
      font: inherit;
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .06em;
      text-transform: uppercase;
      appearance: none;
      cursor: pointer;
      transition: background-color 140ms ease, color 140ms ease, box-shadow 140ms ease;
    }

    .home-league-tabs-trigger-label{
      display: block;
      width: 100%;
      text-align: center;
    }

    .home-league-tabs-trigger::after{
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      border-radius: 0;
      background: transparent;
      transition: background-color 140ms ease;
    }

    .home-league-tabs-trigger:hover{
      background: rgba(var(--home-tabs-accent-rgb), 0.10);
      color: rgba(255,255,255,0.95);
    }

    .home-league-tabs-trigger[data-state="active"]{
      background: rgba(var(--home-tabs-accent-rgb), 0.12);
      color: #f4fbff;
    }

    .home-league-tabs-trigger[data-state="active"]::after{
      background: rgba(var(--home-tabs-accent-rgb), 0.84);
    }

    .home-league-tabs-trigger:focus-visible{
      outline: none;
      box-shadow: inset 0 0 0 1px rgba(var(--home-tabs-accent-rgb), 0.46);
    }

    .league-section{
      margin-top: 18px;
      text-align: center;
    }

    .league-section[hidden]{
      display: none;
    }

    .league-placeholder{
      margin: 0;
      font-size: 14px;
      color: rgba(233,238,248,0.72);
      font-weight: 600;
    }

    .btn{
      appearance:none;
      -webkit-appearance:none;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: rgba(255,255,255,0.92);
      padding: 12px 14px;
      border-radius: 14px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: .10em;
      font-size: 12px;
      cursor:pointer;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      gap: 8px;
      line-height: 1;
    }
    .btn.neon-red{
      color: #ff5a5a;
      border-color: rgba(255,90,90,0.9);
      box-shadow: 0 0 12px rgba(255,90,90,0.45), 0 0 24px rgba(255,90,90,0.2);
      text-shadow: 0 0 8px rgba(255,90,90,0.9);
    }
    .btn.neon-blue{
      color: #7dd3fc;
      border-color: rgba(125,211,252,0.9);
      box-shadow: 0 0 12px rgba(125,211,252,0.45), 0 0 24px rgba(125,211,252,0.2);
      text-shadow: 0 0 8px rgba(125,211,252,0.9);
    }
    .btn.neon-green{
      color: #5dff9c;
      border-color: rgba(93,255,156,0.9);
      box-shadow: 0 0 12px rgba(93,255,156,0.45), 0 0 24px rgba(93,255,156,0.2);
      text-shadow: 0 0 8px rgba(93,255,156,0.9);
    }
    .btn.neon-yellow{
      color: #f6ff6a;
      border-color: rgba(246,255,106,0.9);
      box-shadow: 0 0 12px rgba(246,255,106,0.45), 0 0 24px rgba(246,255,106,0.2);
      text-shadow: 0 0 8px rgba(246,255,106,0.9);
    }
    .btn.neon-purple{
      color: #d176ff;
      border-color: rgba(209,118,255,0.9);
      box-shadow: 0 0 12px rgba(209,118,255,0.45), 0 0 24px rgba(209,118,255,0.2);
      text-shadow: 0 0 8px rgba(209,118,255,0.9);
    }
    .btn.solid-teal{
      color: #2dd4bf;
      border-color: rgba(45,212,191,0.9);
      box-shadow: 0 0 12px rgba(45,212,191,0.45), 0 0 24px rgba(45,212,191,0.2);
      text-shadow: 0 0 8px rgba(45,212,191,0.9);
    }
    .btn.solid-teal:hover{
      color: #5eead4;
      border-color: rgba(94,234,212,0.95);
      background: var(--btn-bg-hover);
    }
    .btn.indigo{
      color: #818cf8;
      border-color: rgba(129,140,248,0.9);
      box-shadow: 0 0 12px rgba(129,140,248,0.45), 0 0 24px rgba(99,102,241,0.22);
      text-shadow: 0 0 8px rgba(129,140,248,0.9);
    }
    .btn.indigo:hover{
      color: #a5b4fc;
      border-color: rgba(165,180,252,0.95);
      background: var(--btn-bg-hover);
    }
    .btn.gold{
      color: #facc15;
      border-color: rgba(250,204,21,0.9);
      box-shadow: 0 0 12px rgba(250,204,21,0.42), 0 0 24px rgba(234,179,8,0.18);
      text-shadow: 0 0 8px rgba(250,204,21,0.82);
    }

      return String(value || "").trim();

    function escapeHtml(value){
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")

    function normalizeNameKey(value){

    function cleanRoleName(name){
      const clean = String(name || "")
        .replace(/^[^A-Za-z0-9\-−–—]+/, "")
        .replace(/\s+/g, " ")
        .trim();
      return clean || "-";
    }

    function recordScoreFromRoleName(name){
      const text = cleanRoleName(name);
      const parenthetical = text.match(/\(([^)]+)\)/)?.[1] || text;
      const signedScore = parenthetical.match(/[+\-−–—]\s*\d+/);
      if(signedScore) return signedScore[0].replace(/[−–—]/g, "-").replace(/\s+/g, "");
      const pointScore = parenthetical.match(/\b\d+\s*(?:point|pt)/i);
      if(pointScore) return `${pointScore[0].replace(/\s*(?:point|pt).*/i, "")}pts`;
      const number = parenthetical.match(/\b\d+\b/);
      return number ? number[0] : text;
    }

    function formatRating(value){
      const number = Number(value);
      if(!Number.isFinite(number)) return "";
      return new Intl.NumberFormat("en-US", {
        useGrouping:false,
        minimumFractionDigits:1,
        maximumFractionDigits:1,
      }).format(number);
    }

      return member?.server_avatar_url || member?.avatar_url || "/logos/golf.png";
    }

    function uniqueValues(values){
      return [...new Set((values || []).map(normalizeSearchText).filter(Boolean))];
    }

    function eventWinnerCacheKey(event){
      return normalizeSearchText(event?.winnerLoader) || `${event?.year || ""}:${event?.month || ""}:${normalizeSearchText(event?.title)}`;
    }

    function loadStoredWinnerProfiles(){
      try{
        const raw = window.localStorage?.getItem(WINNER_PROFILE_STORAGE_KEY);
        if(!raw) return {};
        const payload = JSON.parse(raw);
        return payload?.entries && typeof payload.entries === "object" ? payload.entries : {};
      }catch{
        return {};
      }
    }

    function cachedWinnerForEvent(event){
      const key = eventWinnerCacheKey(event);
      const entry = key ? storedWinnerProfiles[key] : null;
      if(!entry?.winner?.name) return null;
      if(Date.now() - Number(entry.cachedAt || 0) > WINNER_PROFILE_CACHE_TTL_MS) return null;
      return {
        ...(event.fallbackWinner || {}),
        ...entry.winner,
      };
    }

    function serializableWinner(winner){
      return {
        name:normalizeSearchText(winner?.name),
        displayName:normalizeSearchText(winner?.displayName),
        username:normalizeSearchText(winner?.username),
        discordId:normalizeDiscordId(winner?.discordId),
        avatarUrl:normalizeSearchText(winner?.avatarUrl),
      };
    }

    function rememberWinnerForEvent(event, winner){
      const key = eventWinnerCacheKey(event);
      const cachedWinner = serializableWinner(winner);
      if(!key || !cachedWinner.name) return false;
      storedWinnerProfiles[key] = {
        cachedAt:Date.now(),
        winner:cachedWinner,
      };
      return true;
    }

    function persistStoredWinnerProfiles(){
      try{
        window.localStorage?.setItem(WINNER_PROFILE_STORAGE_KEY, JSON.stringify({
          version:1,
          entries:storedWinnerProfiles,
        }));
      }catch{
      }
    }

    function preloadAvatarUrls(avatarUrls){
      uniqueValues(avatarUrls).forEach((avatarUrl) => {
        if(preloadedAvatarUrls.has(avatarUrl)) return;
        preloadedAvatarUrls.add(avatarUrl);
        const image = new Image();
        image.decoding = "async";
        image.referrerPolicy = "no-referrer";
        image.src = avatarUrl;
      });
    }

    function cacheDiscordMember(member){
      const discordId = normalizeDiscordId(member?.discord_user_id);
      if(!discordId) return null;
      const cachedMember = {
        ...member,
        discord_user_id:discordId,
      };
      discordMemberCache.set(discordId, cachedMember);
      return cachedMember;
    }

    async function loadDiscordMembersByIds(discordIds){
      const ids = uniqueValues((discordIds || []).map(normalizeDiscordId));
      const missingIds = ids.filter(id => !discordMemberCache.has(id));
      if(missingIds.length){
        try{
          const { data, error } = await supabase
            .from("discord_guild_members")
            .select("discord_user_id,username,display_name,server_avatar_url,avatar_url")
            .in("discord_user_id", missingIds);
          if(error) throw error;
          const foundIds = new Set();
          (data || []).forEach((member) => {
            const cachedMember = cacheDiscordMember(member);
            if(cachedMember?.discord_user_id) foundIds.add(cachedMember.discord_user_id);
          });
          missingIds.forEach((id) => {
            if(!foundIds.has(id)) discordMemberCache.set(id, null);
          });
        }catch{
          missingIds.forEach((id) => {
            if(!discordMemberCache.has(id)) discordMemberCache.set(id, null);
          });
        }
      }
      return discordMemberCache;
    }

    function winnerLookupKeys(winner){
      const lookupKeys = [
        winner?.name,
        winner?.displayName,
        winner?.username,
        ...(Array.isArray(winner?.aliases) ? winner.aliases : []),
      ].map(normalizeNameKey).filter(Boolean);
      const compactLookupKeys = lookupKeys.map(normalizeProfileLookupKey).filter(Boolean);
      return { lookupKeys, compactLookupKeys };
    }

    function findMemberByWinnerName(rows, winner){
      const { lookupKeys, compactLookupKeys } = winnerLookupKeys(winner);
      if(!lookupKeys.length) return null;
      return rows.find(row => (
        lookupKeys.includes(normalizeNameKey(row.username)) ||
        lookupKeys.includes(normalizeNameKey(row.display_name))
      )) || rows.find(row => (
        compactLookupKeys.includes(normalizeProfileLookupKey(row.username)) ||
        compactLookupKeys.includes(normalizeProfileLookupKey(row.display_name))
      )) || null;
    }

    function sheetNameEscape(value){
      return String(value || "").replace(/'/g, "''");

    function sheetRange(sheetName, range){
      return `'${sheetNameEscape(sheetName)}'!${range}`;
    }

    function normalizeSheetValues(payload){
      if(Array.isArray(payload)) return payload;
      if(payload?.error) throw new Error(payload.error.message || "Google Sheets request failed.");
      if(Array.isArray(payload?.values)) return payload.values;
      if(Array.isArray(payload?.data?.values)) return payload.data.values;
      if(Array.isArray(payload?.result?.values)) return payload.result.values;
      return [];
    }

    async function fetchSheetRange(sheetId, range){
      const payload = { sheetId, range };

      try{
        const response = await fetch(SHEET_WORKER_URL, {
          ...FETCH_NO_STORE,
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body:JSON.stringify(payload),
        });
        if(response.ok) return normalizeSheetValues(await response.json());
      }catch{
      }

      try{
        const url = new URL(SHEET_WORKER_URL);
        url.searchParams.set("sheetId", sheetId);
        url.searchParams.set("range", range);
        const response = await fetch(url.toString(), FETCH_NO_STORE);
        if(response.ok) return normalizeSheetValues(await response.json());
      }catch{
      }

      return fetchSheetRangeGviz(sheetId, range);
    }

    function parseSheetRange(range){
      const text = normalizeSearchText(range);
      const match = text.match(/^'([^']+)'!(.+)$/) || text.match(/^([^!]+)!(.+)$/);
      if(match) return { sheetName:match[1], a1:match[2] };
      return { sheetName:"", a1:text };
    }

    function parseGvizResponse(text){
      const match = String(text || "").match(/google\.visualization\.Query\.setResponse\((.*)\);?\s*$/s);
      if(!match) throw new Error("Unable to parse Google Sheets response.");
      const payload = JSON.parse(match[1]);
      const rows = payload?.table?.rows ?? [];
      return rows.map(row => (row.c ?? []).map(cell => cell?.v ?? ""));
    }

    async function fetchSheetRangeGviz(sheetId, range){
      const { sheetName, a1 } = parseSheetRange(range);
      const url = new URL(`https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq`);
      url.searchParams.set("tqx", "out:json");
      if(sheetName) url.searchParams.set("sheet", sheetName);
      if(a1) url.searchParams.set("range", a1);
      const response = await fetch(url.toString(), FETCH_NO_STORE);
      if(!response.ok){
        const text = await response.text().catch(() => "");
        throw new Error(`Google Sheets request failed (${response.status}). ${text}`.trim());
      }
      return parseGvizResponse(await response.text());
    }

    async function fetchSheetRanges(sheetId, ranges){
      const payload = { sheetId, ranges };
      try{
        const response = await fetch(SHEET_WORKER_URL, {
          ...FETCH_NO_STORE,
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body:JSON.stringify(payload),
        });
        if(response.ok){
          const payload = await response.json();
          const valueRanges = Array.isArray(payload?.valueRanges) ? payload.valueRanges : [];
          if(valueRanges.length){
            return valueRanges.map(valueRange => normalizeSheetValues(valueRange));
          }
        }
      }catch{
      }

      return Promise.all(ranges.map(range => fetchSheetRange(sheetId, range)));
    }

    async function fetchSheetRangeDirect(sheetId, range){
      const url = new URL(SHEET_WORKER_URL);
      url.searchParams.set("sheetId", sheetId);
      url.searchParams.set("range", range);
      const response = await fetch(url.toString(), FETCH_NO_STORE);
      if(!response.ok) throw new Error(`Sheet request failed (${response.status})`);
      return normalizeSheetValues(await response.json());
    }

    function eventBaseStatus(event){
      if(event.status === "live") return "live";
      if(event.year < CURRENT_YEAR) return "past";
      if(event.year > CURRENT_YEAR) return "upcoming";
      if(event.month <= CURRENT_MONTH_INDEX) return "live";
      return "upcoming";

    function eventStateKind(event, winner = null){

        : `<span class="event-winner-name">${displayName}</span>`;
      const portraitMarkup = avatar
        ? `<img class="event-winner-portrait" src="${escapeHtml(avatar)}" alt="" width="140" height="140" loading="lazy" decoding="async" fetchpriority="low" referrerpolicy="no-referrer" />`
        : "";
      return `
        <span class="event-winner-slot">
          ${portraitMarkup}
          <span class="event-winner">
            ${trophyIconSvg()}
            ${nameMarkup}
          </span>
        </span>

    }

    async function resolveEventWinner(event){
      if(!event.winnerLoader || !WINNER_LOADERS[event.winnerLoader]) return;
      if(!winnerCache.has(event.winnerLoader)){
        winnerCache.set(event.winnerLoader, Promise.resolve(WINNER_LOADERS[event.winnerLoader]()).catch(() => null));
      }
      const loadedWinner = await winnerCache.get(event.winnerLoader);
      return loadedWinner
        ? { ...(event.fallbackWinner || {}), ...loadedWinner }
        : event.fallbackWinner;
    }

    async function hydrateEventWinners(events, yearValue){
      const winnerEvents = (events || []).filter(event => event.winnerLoader && WINNER_LOADERS[event.winnerLoader]);
      if(!winnerEvents.length) return;

      try{
        const winnerEntries = await Promise.all(winnerEvents.map(async (event) => ({
          event,
          winner:await resolveEventWinner(event).catch(() => event.fallbackWinner || null),
        })));
        if(String(yearValue) !== activeCalendarYear) return;

        const enrichedWinners = await enrichWinnerProfiles(winnerEntries.map(entry => entry.winner));
        if(String(yearValue) !== activeCalendarYear) return;

        preloadAvatarUrls(enrichedWinners.map(winner => winner?.avatarUrl));
        let didCacheWinner = false;
        enrichedWinners.forEach((winner, index) => {
          if(!winner?.name) return;
          const event = winnerEntries[index].event;
          updateEventRow(event, winner);
          didCacheWinner = rememberWinnerForEvent(event, winner) || didCacheWinner;
        });
        if(didCacheWinner){
          persistStoredWinnerProfiles();
        }
      }catch{
        // Keep the deterministic month-based status if a tournament source is unavailable.
      }
    }

    async function loadNoptationalWinner(){
      const sheetId = "1T7kmgUtimrOW3LaTw2hYLMFvO600SjmUDLTecL6gY00";
      const courses = [
        { minimum:-12, columns:[1, 2] },
        { minimum:-10, columns:[3, 4] },
        { minimum:-3, columns:[5, 6, 7] },
        { minimum:-22, columns:[8, 9] },
      ];
      const rows = await fetchSheetRange(sheetId, sheetRange("Round Scores (2026)", "A1:J250"));
      const players = (rows || []).slice(1).map((row) => {
        const { display, username } = noptationalDisplayParts(row?.[0]);
        if(!display) return null;
        let total = 0;
        let countedCount = 0;
        let cut = false;
        courses.forEach((course) => {
          const scores = course.columns.map(column => parseNoptationalScore(row?.[column])).filter(score => score !== null);
          total += scores.reduce((sum, score) => sum + score, 0);
          countedCount += scores.length;
          if(scores.length && Math.min(...scores) > course.minimum) cut = true;
        });
        return { display, username, total, countedCount, cut };
      }).filter(player => player && player.countedCount > 0 && !player.cut)
        .sort((left, right) => left.total - right.total || right.countedCount - left.countedCount || left.display.localeCompare(right.display));
      const winner = players[0];
      if(!winner) return null;
      return { name:winner.display, username:winner.username };
    }

    function numericStats(values){
      const cleanValues = values.map(Number).filter(Number.isFinite);
      if(!cleanValues.length) return { mean:0, std:1 };
      const mean = cleanValues.reduce((sum, value) => sum + value, 0) / cleanValues.length;
      const variance = cleanValues.reduce((sum, value) => sum + ((value - mean) ** 2), 0) / cleanValues.length;
      const std = Math.sqrt(variance);
      return { mean, std:std > 0 ? std : 1 };
    }

    function zScore(value, stats){
      return (Number(value) - stats.mean) / stats.std;
    }

    function normalizeRatingToStats(value, sourceStats, targetStats){
      return targetStats.mean + (zScore(value, sourceStats) * targetStats.std);
    }

    function tournamentGpiBaseRating(tournamentRun){
      const baseRating = Number(tournamentRun?.base_rating);
      return Number.isFinite(baseRating) ? baseRating : DEFAULT_GPI_BASE_RATING;
    }

    function tournamentFittedRating(row){
      const rawRating = Number(row?.raw_rating);
      if(Number.isFinite(rawRating)) return rawRating;
      const rating = Number(row?.rating);
      return Number.isFinite(rating) ? rating : 0;
    }

    function tournamentDistributionRating(row, tournamentRun){
      const fittedRating = tournamentFittedRating(row);
      const weightedMatches = Number(row?.weighted_matches) || 0;
      const reliability = Math.min(
        1,
        Math.max(0, weightedMatches / TOURNAMENT_GPI_DISTRIBUTION_SHRINKAGE_WEIGHTED_MATCHES)
      );
      const baseRating = tournamentGpiBaseRating(tournamentRun);
      return baseRating + (reliability * (fittedRating - baseRating));
    }

    function tournamentAdjustmentFromDelta(deltaZ, reliability){
      const scale = deltaZ >= 0 ? COMBINED_POSITIVE_SCALE : COMBINED_NEGATIVE_SCALE;
      return reliability * scale * Math.tanh(deltaZ / COMBINED_TANH_SCALE);
    }

    function tournamentDeltaConfidence(matchesPlayed){
      const progress = Math.min(1, Math.max(0, (Number(matchesPlayed) || 0) / COMBINED_FULL_DELTA_MATCHES));
      return progress * progress * (3 - (2 * progress));
    }

    function tournamentDeltaRating(row){
      return tournamentFittedRating(row);
    }

    function probabilityLogit(probability){
      const p = Math.max(.000001, Math.min(.999999, Number(probability) || .5));
      return Math.log(p / (1 - p));
    }

    function probabilityFromLogit(logit){
      return 1 / (1 + Math.exp(-logit));
    }

    function calibratedFavoriteProbability(delta){
      const cleanDelta = Math.max(0, Math.abs(Number(delta) || 0));
      const curve = HISTORICAL_GPI_WIN_CURVE;
      if(cleanDelta <= curve[0].delta) return curve[0].probability;
      for(let index = 1; index < curve.length; index += 1){
        const previous = curve[index - 1];
        const next = curve[index];
        if(cleanDelta <= next.delta){
          const progress = (cleanDelta - previous.delta) / (next.delta - previous.delta);
          return previous.probability + ((next.probability - previous.probability) * progress);
        }
      }
      const previous = curve[curve.length - 2];
      const last = curve[curve.length - 1];
      const logitSlope = (probabilityLogit(last.probability) - probabilityLogit(previous.probability)) / (last.delta - previous.delta);
      return probabilityFromLogit(probabilityLogit(last.probability) + ((cleanDelta - last.delta) * logitSlope));
    }

    function tournamentWinProbabilityFromRatings(leftRating, rightRating){
      const left = Number(leftRating);
      const right = Number(rightRating);
      if(!Number.isFinite(left) || !Number.isFinite(right)) return .5;
      const favoriteProbability = calibratedFavoriteProbability(left - right);
      return left >= right ? favoriteProbability : 1 - favoriteProbability;
    }

    function buildTournamentNegativeEvidenceConfidence(tournamentRatings, tournamentMatches){
      const ratingById = new Map(
        tournamentRatings
          .map(row => [normalizeDiscordId(row.discord_user_id), tournamentDeltaRating(row)])
          .filter(([discordId, rating]) => discordId && Number.isFinite(rating))
      );
      const evidenceById = new Map();
      const addEvidence = (discordId, evidence) => {
        if(!discordId || !Number.isFinite(evidence) || evidence <= 0) return;
        evidenceById.set(discordId, (evidenceById.get(discordId) || 0) + evidence);
      };

      for(const match of tournamentMatches || []){
        const playerA = normalizeDiscordId(match.player_a_discord_user_id);
        const playerB = normalizeDiscordId(match.player_b_discord_user_id);
        const winner = normalizeDiscordId(match.winner_discord_user_id);
        if(!playerA || !playerB || !winner) continue;
        const loser = winner === playerA ? playerB : winner === playerB ? playerA : "";
        if(!loser) continue;
        const expectedWin = tournamentWinProbabilityFromRatings(ratingById.get(loser), ratingById.get(winner));
        if(expectedWin <= .5) continue;
        addEvidence(loser, TOURNAMENT_NEGATIVE_EVIDENCE_MIN_UPSET_LOSS + ((expectedWin - .5) * 2));
      }

      return new Map([...evidenceById.entries()].map(([discordId, evidence]) => [
        discordId,
        Math.min(1, Math.max(0, evidence / TOURNAMENT_NEGATIVE_EVIDENCE_FULL_UPSET_LOSSES)),
      ]));
    }

    function applyTournamentNegativeEvidenceGate(delta, evidenceConfidence){
      const number = Number(delta);
      if(!Number.isFinite(number) || number >= 0) return number;
      return number * Math.min(1, Math.max(0, Number(evidenceConfidence) || 0));
    }

    function buildTournamentStrengthOfSchedule(tournamentRatings, tournamentMatches, tournamentRun){
      const ratingById = new Map(
        tournamentRatings
          .map(row => [normalizeDiscordId(row.discord_user_id), tournamentDistributionRating(row, tournamentRun)])
          .filter(([discordId, rating]) => discordId && Number.isFinite(rating))
      );
      const scheduleById = new Map();
      const addOpponent = (discordId, opponentRating) => {
        if(!discordId || !Number.isFinite(opponentRating)) return;
        const current = scheduleById.get(discordId) || { total:0, count:0 };
        current.total += opponentRating;
        current.count += 1;
        scheduleById.set(discordId, current);
      };

      for(const match of tournamentMatches || []){
        const playerA = normalizeDiscordId(match.player_a_discord_user_id);
        const playerB = normalizeDiscordId(match.player_b_discord_user_id);
        addOpponent(playerA, ratingById.get(playerB));
        addOpponent(playerB, ratingById.get(playerA));
      }

      return new Map([...scheduleById.entries()].map(([discordId, schedule]) => [
        discordId,
        schedule.count > 0 ? schedule.total / schedule.count : null,
      ]));
    }

    function buildHomeCombinedGpiRows(rankedRatings, tournamentRatings, membersById, tournamentMatches, tournamentRun, hiddenIds){
      const tournamentById = new Map(
        tournamentRatings
          .map(row => [normalizeDiscordId(row.discord_user_id), row])
          .filter(([discordId]) => discordId)
      );
      const rankedRows = rankedRatings
        .map((row) => {
          const discordId = normalizeDiscordId(row.discord_user_id);
          const rankedMatches = Number(row.matches_played) || 0;
          if(!discordId || rankedMatches < COMBINED_MIN_RANKED_MATCHES) return null;
          const member = membersById.get(discordId);
          const rankedRating = Number(row.rating) || 0;
          return {
            rankedRow:row,
            tournamentRow:tournamentById.get(discordId) || null,
            discordId,
            member,
            displayName:memberDisplayName(member, row.display_name || "Player"),
            avatarUrl:avatarUrlForMember(member),
            rankedRating,
            rankedMatches,
          };
        })
        .filter(Boolean);
      const qualifiedRankedIds = new Set(rankedRows.map(row => row.discordId));
      const bridgeRows = rankedRows.filter(row =>
        row.tournamentRow &&
        (Number(row.tournamentRow.matches_played) || 0) >= COMBINED_MIN_TOURNAMENT_MATCHES
      );
      const rankedStats = numericStats(bridgeRows.map(row => row.rankedRating));
      const tournamentStats = numericStats(bridgeRows.map(row => tournamentDistributionRating(row.tournamentRow, tournamentRun)));
      const tournamentStrengthById = buildTournamentStrengthOfSchedule(tournamentRatings, tournamentMatches, tournamentRun);
      const tournamentNegativeEvidenceById = buildTournamentNegativeEvidenceConfidence(tournamentRatings, tournamentMatches);
      const hasBridge = bridgeRows.length >= 2;

      const rows = rankedRows.map((row) => {
        const tournamentRow = row.tournamentRow;
        const tournamentMatchesPlayed = Number(tournamentRow?.matches_played) || 0;
        let tournamentDelta = 0;
        if(hasBridge && tournamentRow && tournamentMatchesPlayed >= COMBINED_MIN_TOURNAMENT_MATCHES){
          const tournamentRating = tournamentDeltaRating(tournamentRow);
          const reliability = tournamentDeltaConfidence(tournamentMatchesPlayed);
          const tournamentDeltaZ = zScore(tournamentRating, tournamentStats) - zScore(row.rankedRating, rankedStats);
          tournamentDelta = applyTournamentNegativeEvidenceGate(
            tournamentAdjustmentFromDelta(tournamentDeltaZ, reliability),
            tournamentNegativeEvidenceById.get(row.discordId) || 0
          );
        }
        const rating = row.rankedRating + tournamentDelta;
        return {
          discordId:row.discordId,
          displayName:row.displayName,
          avatarUrl:row.avatarUrl,
          ratingNumber:rating,
          rankedRatingNumber:row.rankedRating,
          hidden:hiddenIds.has(row.discordId),
        };
      });

      for(const tournamentRow of tournamentRatings){
        const discordId = normalizeDiscordId(tournamentRow.discord_user_id);
        if(!discordId || qualifiedRankedIds.has(discordId)) continue;
        const tournamentMatchesPlayed = Number(tournamentRow.matches_played) || 0;
        if(tournamentMatchesPlayed < COMBINED_MIN_TOURNAMENT_MATCHES) continue;
        const member = membersById.get(discordId);
        const tournamentRating = tournamentFittedRating(tournamentRow);
        const tournamentStrengthOfSchedule = tournamentStrengthById.get(discordId);
        const normalizedTournamentRating = hasBridge
          ? normalizeRatingToStats(tournamentRating, tournamentStats, rankedStats)
          : tournamentRating;
        const normalizedStrengthOfSchedule = Number.isFinite(tournamentStrengthOfSchedule)
          ? (hasBridge ? normalizeRatingToStats(tournamentStrengthOfSchedule, tournamentStats, rankedStats) : tournamentStrengthOfSchedule)
          : normalizedTournamentRating;
        const provisionalRating =
          (COMBINED_PROVISIONAL_TOURNAMENT_WEIGHT * normalizedTournamentRating) +
          (COMBINED_PROVISIONAL_SOS_WEIGHT * normalizedStrengthOfSchedule);

        rows.push({
          discordId,
          displayName:memberDisplayName(member, tournamentRow.display_name || "Player"),
          avatarUrl:avatarUrlForMember(member),
          ratingNumber:provisionalRating,
          rankedRatingNumber:provisionalRating,
          hidden:hiddenIds.has(discordId),
        });
      }

      rows.sort((left, right) =>
        right.ratingNumber - left.ratingNumber ||
        right.rankedRatingNumber - left.rankedRatingNumber ||
        left.displayName.localeCompare(right.displayName)
      );

      let nextRank = 1;
      return rows
        .map((row) => {
          if(row.hidden) return { ...row, rank:"" };
          const rankedRow = { ...row, rank:nextRank };
          nextRank += 1;
          return rankedRow;
        })
        .filter(row => !row.hidden);
    }

    async function loadHomeGpiRows(){
      const { data:runs, error:runsError } = await supabase
        .from("internal_ranked_gpi_runs")
        .select("id,created_at,config")
        .eq("model", "combined")
        .order("created_at", { ascending:false })
        .limit(2);
      if(runsError) throw runsError;
      const currentRun = runs?.[0];
      const previousRun = runs?.[1];
      if(!currentRun){
        if(homeGpiDate) homeGpiDate.textContent = "No published rankings yet";
        return [];
      }

      const loadPreview = async (runId) => {
        if(!runId) return [];
        const { data, error } = await supabase
          .from("internal_ranked_gpi_ratings")
          .select("discord_user_id,display_name,rating,rank")
          .eq("run_id", runId)
          .order("rank", { ascending:true })
          .range(0, 99);
        if(error) throw error;
        return data || [];
      };
      const [currentRatings, previousRatings, hiddenIds] = await Promise.all([
        loadPreview(currentRun.id),
        loadPreview(previousRun?.id),
        loadHiddenGpiPlayerIds(),
      ]);
      const visibleRows = (ratings) => ratings
        .filter(row => !hiddenIds.has(normalizeDiscordId(row.discord_user_id)))
        .map((row, index) => ({ ...row, visibleRank:index + 1 }));
      const currentRows = visibleRows(currentRatings);
      const previousRanks = new Map(
        visibleRows(previousRatings).map(row => [normalizeDiscordId(row.discord_user_id), row.visibleRank])
      );
      const memberMap = await loadDiscordMembersByIds(currentRows.map(row => row.discord_user_id));
      if(homeGpiDate){
        const date = new Date(currentRun.config?.ranking_at || currentRun.created_at);
        const label = Number.isNaN(date.getTime()) ? "Date unavailable" : new Intl.DateTimeFormat("en-US", {
          month:"long",
          day:"numeric",
          year:"numeric",
          timeZone:"UTC",
        }).format(date);
        homeGpiDate.textContent = `Rankings as of ${label}`;
      }
      return currentRows.slice(0, HOME_GPI_LIMIT).map(row => {
        const discordId = normalizeDiscordId(row.discord_user_id);
        const member = memberMap.get(discordId);
        const previousRank = previousRanks.get(discordId);
        return {
          discordId,
          rank:row.visibleRank,
          rankDelta:previousRank ? previousRank - row.visibleRank : 0,
          displayName:memberDisplayName(member, row.display_name || "Player"),
          avatarUrl:avatarUrlForMember(member),
          rating:formatRating(row.rating),
        };
      });
    }

    function homeGpiRankHtml(row, fallbackRank){
      const rank = escapeHtml(row.rank || fallbackRank);
      const delta = Number(row.rankDelta) || 0;
      if(!delta) return `<span class="home-gpi-rank-value"><span class="home-gpi-rank-number">${rank}</span><span class="home-gpi-rank-delta is-flat" aria-label="No rank change">-</span></span>`;
      const up = delta > 0;
      const amount = Math.abs(delta);
      const icon = up
        ? `<svg class="lucide lucide-arrow-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg>`
        : `<svg class="lucide lucide-arrow-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="m19 12-7 7-7-7"></path></svg>`;
      return `<span class="home-gpi-rank-value"><span class="home-gpi-rank-number">${rank}</span><span class="home-gpi-rank-delta ${up ? "is-up" : "is-down"}" aria-label="${up ? "Up" : "Down"} ${amount}">${icon}${escapeHtml(amount)}</span></span>`;
    }

    function renderHomeGpiRows(rows){
      if(!homeGpiList) return;
      if(!rows.length){
        homeGpiList.innerHTML = `<li class="rail-empty">No GPI rankings available.</li>`;
        return;
      }
      homeGpiList.innerHTML = rows.slice(0, HOME_GPI_LIMIT).map((row, index) => `
        <li>
          <a class="home-gpi-row" href="/player.html?id=${encodeURIComponent(row.discordId)}" aria-label="View ${escapeHtml(row.displayName)} profile">
            <span class="home-gpi-rank">${homeGpiRankHtml(row, index + 1)}</span>
            <span class="home-gpi-player">
              <img class="home-gpi-avatar" src="${escapeHtml(row.avatarUrl)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" />
              <span class="home-gpi-name">${escapeHtml(row.displayName)}</span>
            </span>
            <span class="home-gpi-rating">${escapeHtml(row.rating)}</span>
          </a>
        </li>
      `).join("");
    }

    async function loadHomeGpiSummary(){
      try{
        renderHomeGpiRows(await loadHomeGpiRows());
      }catch{
        if(homeGpiDate) homeGpiDate.textContent = "Latest rankings date unavailable";
        if(homeGpiList) homeGpiList.innerHTML = `<li class="rail-empty">Unable to load GPI.</li>`;
      }
    }

    function initHomeRailData(){
      void loadHomeRecordsSummary();
      void loadHomeGpiSummary();
    }

    initHomePrimaryTabs();
    initLeagueTabs();
    initHomeRailData();

    function getDiscordIdentity(user){
      const identities = Array.isArray(user?.identities) ? user.identities : [];
      return identities.find(identity => normalizeSearchText(identity?.provider).toLowerCase() === "discord") || null;
    }

    function getDiscordIdFromUser(user){
      const identity = getDiscordIdentity(user);
      return normalizeDiscordId(
        identity?.provider_id ||
        identity?.identity_data?.provider_id ||
        identity?.identity_data?.sub ||
        identity?.identity_data?.id ||
        user?.user_metadata?.provider_id ||
        user?.user_metadata?.sub
      );
    }

    function setDiscordInviteVisible(isVisible){
      if(!homeDiscordInviteEl) return;
      homeDiscordInviteEl.classList.toggle("is-visible", isVisible);
      homeDiscordInviteEl.toggleAttribute("inert", !isVisible);
      homeDiscordInviteEl.setAttribute("aria-hidden", isVisible ? "false" : "true");
    }

    async function getProfileDiscordId(user){
      if(!user?.id) return "";

      try{
        const { data, error } = await supabase
          .from("profiles")
          .select("discord_user_id")
          .eq("user_id", user.id)
          .maybeSingle();
        if(error) return "";
        return normalizeDiscordId(data?.discord_user_id);
      }catch{
        return "";
      }
    }

    async function userHasDiscordMemberRecord(user){
      const discordId = normalizeDiscordId(await getProfileDiscordId(user)) || getDiscordIdFromUser(user);
      if(!discordId) return false;

      try{
        const { data, error } = await supabase
          .from("discord_guild_members")
          .select("discord_user_id")
          .eq("discord_user_id", discordId)
          .eq("is_current_member", true)
          .maybeSingle();
        if(error) return null;
        return !!data;
      }catch{
        return null;
      }
    }

    async function updateDiscordInviteVisibility(){
      setDiscordInviteVisible(false);
      try{
        const { data: sessionData } = await supabase.auth.getSession();
        if(!sessionData?.session?.user){
          setDiscordInviteVisible(true);
          return;
        }

        let user = sessionData.session.user;
        try{
          const { data: userData, error } = await supabase.auth.getUser();
          if(!error && userData?.user?.id === user.id){
            user = userData.user;
          }
        }catch{
          // Session user is enough for the membership check fallback.
        }

        const isMember = await userHasDiscordMemberRecord(user);
        if(isMember !== null) setDiscordInviteVisible(!isMember);
      }catch{}
    }

    async function loadMemberSearchRows(){
      if(memberSearchRows.length) return memberSearchRows;
      if(memberSearchPromise) return memberSearchPromise;

      memberSearchPromise = (async () => {
        const rows = [];
        for(let from = 0;; from += MEMBER_PAGE_SIZE){
          const to = from + MEMBER_PAGE_SIZE - 1;
          const { data, error } = await supabase
            .from("discord_guild_members")
            .select("discord_user_id,username,display_name,server_avatar_url,avatar_url")
            .eq("is_current_member", true)
            .range(from, to);

          if(error) throw error;
          rows.push(...(data || []));
          if(!data || data.length < MEMBER_PAGE_SIZE) break;
        }

        memberSearchRows = rows
          .filter(member => normalizeSearchText(member?.discord_user_id))
          .map((member) => ({
            ...member,
            displaySearch: normalizeSearchKey(member.display_name),
            usernameSearch: normalizeSearchKey(member.username),
          }));
        return memberSearchRows;
      })().finally(() => {
        memberSearchPromise = null;
      });

      return memberSearchPromise;
    }

    function scoreMemberSearchResult(member, query){
      const display = member.displaySearch;
      const username = member.usernameSearch;
      if(!query) return 0;
      if(display === query) return 120;
      if(username === query) return 110;
      if(display.startsWith(query)) return 95;
      if(username.startsWith(query)) return 85;
      if(display.includes(query)) return 65;
      if(username.includes(query)) return 55;
      return 0;
    }

    function hidePlayerSearchResults(){
      playerSearchResults.hidden = true;
      playerSearchInput.setAttribute("aria-expanded", "false");
    }

    function showPlayerSearchResults(){
      playerSearchResults.hidden = false;
      playerSearchInput.setAttribute("aria-expanded", "true");
    }

    function renderPlayerSearchResults(results, query){
      playerSearchResults.innerHTML = "";

      if(!query){
        hidePlayerSearchResults();
        return;
      }

      if(!results.length){
        const empty = document.createElement("p");
        empty.className = "player-search-empty";
        empty.textContent = "No players found.";
        playerSearchResults.appendChild(empty);
        showPlayerSearchResults();
        return;
      }

      for(const member of results){
        const button = document.createElement("button");
        button.className = "player-search-result";
        button.type = "button";
        button.dataset.playerId = member.discord_user_id;

        const avatar = document.createElement("img");
        avatar.className = "player-search-avatar";
        avatar.src = avatarUrlForMember(member);
        avatar.alt = "";
        avatar.loading = "lazy";
        avatar.decoding = "async";
        avatar.referrerPolicy = "no-referrer";

        const copy = document.createElement("span");
        copy.className = "player-search-copy";

        const displayName = document.createElement("span");
        displayName.className = "player-search-display";
        displayName.textContent = normalizeSearchText(member.display_name) || normalizeSearchText(member.username) || member.discord_user_id;

        const username = document.createElement("span");
        username.className = "player-search-username";
        username.textContent = normalizeSearchText(member.username) || member.discord_user_id;

        copy.append(displayName, username);
        button.append(avatar, copy);
        playerSearchResults.appendChild(button);
      }

      showPlayerSearchResults();
    }

    async function updatePlayerSearch(){
      const query = normalizeSearchKey(playerSearchInput.value);
      if(!query){
        hidePlayerSearchResults();
        return;
      }

      try{
        const rows = await loadMemberSearchRows();
        const results = rows
          .map(member => ({ member, score: scoreMemberSearchResult(member, query) }))
          .filter(result => result.score > 0)
          .sort((left, right) => {
            if(right.score !== left.score) return right.score - left.score;
            return normalizeSearchText(left.member.display_name || left.member.username)
              .localeCompare(normalizeSearchText(right.member.display_name || right.member.username));
          })
          .slice(0, PLAYER_SEARCH_LIMIT)
          .map(result => result.member);
        renderPlayerSearchResults(results, query);
      }catch(error){
        console.error(error);
        playerSearchResults.innerHTML = "";
        const empty = document.createElement("p");
        empty.className = "player-search-empty";
        empty.textContent = "Could not load players.";
        playerSearchResults.appendChild(empty);
        showPlayerSearchResults();
      }
    }

    playerSearchInput.addEventListener("focus", () => {
      void loadMemberSearchRows();
      void updatePlayerSearch();
    });

    playerSearchInput.addEventListener("input", () => {
      void updatePlayerSearch();
    });

    playerSearchResults.addEventListener("click", (event) => {
      const result = event.target.closest(".player-search-result[data-player-id]");
      if(!result) return;
      window.location.href = `/player.html?id=${encodeURIComponent(result.dataset.playerId)}`;
    });

    document.addEventListener("click", (event) => {
      if(playerSearchEl.contains(event.target)) return;
      hidePlayerSearchResults();
    });

    void updateDiscordInviteVisibility();
    supabase.auth.onAuthStateChange(() => {
      void updateDiscordInviteVisibility();
    });
  </script>

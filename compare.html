<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#020B18" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Player Compare</title>
  <link rel="icon" type="image/png" href="/logos/golf.png" />
  <style>
    :root{
      color-scheme:dark;
      --bg1:#061C3B;
      --bg2:#04142E;
      --bg3:#020B18;
      --panel:rgba(15,23,42,.96);
      --panel-2:rgba(20,31,52,.96);
      --text:#e9eef8;
      --muted:#9ca3c7;
      --line:rgba(148,163,184,.20);
      --line-strong:rgba(148,163,184,.32);
      --accent:#cbd5e1;
      --danger:#fca5a5;
      --tie:#cbd5e1;
      --shadow:0 26px 42px rgba(0,0,0,.34);
      --player-a-color:#e2e8f0;
      --player-b-color:#94a3b8;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100vh;
      background-color:var(--bg3);
      background-image:linear-gradient(to bottom, var(--bg1), var(--bg2), var(--bg3));
      color:var(--text);
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main{
      width:min(1040px, calc(100vw - 32px));
      margin:0 auto;
      padding:32px 0 48px;
    }

    .page-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      margin-bottom:18px;
      padding:16px 18px;
      border:1px solid rgba(255,255,255,.10);
      border-radius:8px;
      background:rgba(3,18,42,.70);
      backdrop-filter:blur(10px);
    }

    .page-title{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .title-logo{
      width:38px;
      height:38px;
      object-fit:contain;
      flex:0 0 auto;
    }

    h1{
      margin:0;
      font-size:clamp(28px, 4vw, 42px);
      line-height:1;
      letter-spacing:0;
    }

    .subtitle{
      margin:6px 0 0;
      color:var(--muted);
      font-size:14px;
    }

    .compare-panel{
      border:1px solid var(--line);
      border-radius:8px;
      background:var(--panel);
      box-shadow:var(--shadow);
      overflow:visible;
    }

    .selector-grid{
      display:grid;
      grid-template-columns:minmax(0, 1fr) auto minmax(0, 1fr);
      gap:14px;
      align-items:start;
      padding:16px;
      border-bottom:1px solid var(--line);
    }

    .selector{
      position:relative;
      min-width:0;
    }

    .selector-label{
      display:block;
      margin:0 0 8px;
      color:var(--muted);
      font-size:12px;
      font-weight:850;
      line-height:1;
      letter-spacing:.06em;
      text-transform:uppercase;
    }

    .player-search{
      position:relative;
    }

    .player-search-input{
      width:100%;
      min-height:44px;
      border:1px solid var(--line-strong);
      border-radius:8px;
      background:rgba(2,8,23,.70);
      color:var(--text);
      font:inherit;
      font-size:15px;
      padding:0 86px 0 13px;
      outline:none;
    }

    .player-search-input::-webkit-search-cancel-button{
      appearance:none;
      display:none;
    }

    .player-search-input::placeholder{
      color:rgba(156,163,199,.72);
    }

    .player-search-input:focus{
      border-color:rgba(203,213,225,.72);
      box-shadow:0 0 0 3px rgba(203,213,225,.12);
    }

    .player-color-control{
      width:34px;
      height:28px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex:0 0 auto;
      border-radius:999px;
      cursor:pointer;
    }

    .player-color-input{
      width:34px;
      height:24px;
      flex:0 0 auto;
      border:0;
      border-radius:999px;
      background:transparent;
      padding:0;
      cursor:pointer;
    }

    .player-color-input::-webkit-color-swatch-wrapper{
      padding:0;
    }

    .player-color-input::-webkit-color-swatch{
      border:1px solid rgba(255,255,255,.20);
      border-radius:999px;
    }

    .player-color-input::-moz-color-swatch{
      border:1px solid rgba(255,255,255,.20);
      border-radius:999px;
    }

    .player-search-actions{
      position:absolute;
      top:50%;
      right:9px;
      display:flex;
      align-items:center;
      gap:7px;
      transform:translateY(-50%);
    }

    .player-search-clear{
      width:26px;
      height:26px;
      display:grid;
      place-items:center;
      border:1px solid rgba(148,163,184,.22);
      border-radius:999px;
      background:rgba(15,23,42,.82);
      color:rgba(226,232,240,.88);
      cursor:pointer;
      opacity:0;
      pointer-events:none;
      transition:opacity .14s ease, border-color .14s ease, color .14s ease;
    }

    .player-search[data-has-value="true"]:focus-within .player-search-clear{
      opacity:1;
      pointer-events:auto;
    }

    .player-search-clear:hover,
    .player-search-clear:focus-visible{
      border-color:rgba(203,213,225,.58);
      color:#fff;
      outline:none;
    }

    .player-search-clear svg{
      width:14px;
      height:14px;
    }

    .player-search-results{
      position:absolute;
      z-index:20;
      top:calc(100% + 8px);
      left:0;
      right:0;
      max-height:320px;
      overflow:auto;
      border:1px solid var(--line-strong);
      border-radius:8px;
      background:rgba(10,19,34,.98);
      box-shadow:0 18px 32px rgba(0,0,0,.40);
      padding:6px;
    }

    .player-search-results[hidden]{
      display:none;
    }

    .player-search-result{
      width:100%;
      display:grid;
      grid-template-columns:34px minmax(0, 1fr);
      gap:10px;
      align-items:center;
      border:0;
      border-radius:7px;
      background:transparent;
      color:var(--text);
      padding:8px;
      text-align:left;
      cursor:pointer;
      font:inherit;
    }

    .player-search-result:hover,
    .player-search-result:focus-visible{
      background:rgba(148,163,184,.12);
      outline:none;
    }

    .player-search-avatar{
      width:34px;
      height:34px;
      border-radius:50%;
      object-fit:cover;
      background:rgba(148,163,184,.16);
    }

    .player-search-copy{
      display:grid;
      gap:2px;
      min-width:0;
    }

    .player-search-display{
      overflow:hidden;
      color:var(--text);
      font-size:14px;
      font-weight:850;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .player-search-username{
      overflow:hidden;
      color:var(--muted);
      font-size:12px;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .player-search-empty{
      margin:0;
      padding:12px 10px;
      color:var(--muted);
      font-size:13px;
    }

    .swap-button{
      width:44px;
      height:44px;
      margin-top:calc(12px + 8px);
      border:1px solid var(--line-strong);
      border-radius:8px;
      background:rgba(2,8,23,.58);
      color:var(--text);
      cursor:pointer;
      display:grid;
      place-items:center;
    }

    .swap-button:hover,
    .swap-button:focus-visible{
      border-color:rgba(203,213,225,.72);
      color:var(--accent);
      outline:none;
    }

    .swap-button svg{
      width:20px;
      height:20px;
    }

    .status{
      padding:18px;
      color:var(--muted);
      font-size:14px;
    }

    .results{
      padding:16px;
    }

    .results[hidden]{
      display:none;
    }

    h2{
      margin:0;
      font-size:18px;
      letter-spacing:0;
    }

    .matchup-card{
      display:grid;
      grid-template-columns:minmax(0, 1fr) minmax(78px, 112px) minmax(0, 1fr);
      gap:10px 12px;
      align-items:center;
      margin-bottom:16px;
      border:1px solid var(--line);
      border-radius:8px;
      background:linear-gradient(180deg, rgba(20,31,52,.98), rgba(15,23,42,.98));
      padding:14px;
    }

    .matchup-player{
      min-width:0;
      display:grid;
      gap:9px;
      align-items:center;
      justify-items:center;
      padding:4px 0 2px;
      text-align:center;
    }

    .matchup-player::after{
      content:"";
      width:100%;
      height:3px;
      border-radius:999px;
      background:var(--player-a-color);
      opacity:.88;
      box-shadow:0 0 18px color-mix(in srgb, var(--player-a-color) 32%, transparent);
    }

    .matchup-player-right::after{
      background:var(--player-b-color);
      box-shadow:0 0 18px color-mix(in srgb, var(--player-b-color) 32%, transparent);
    }

    .matchup-avatar{
      width:48px;
      height:48px;
      border-radius:50%;
      object-fit:cover;
      background:rgba(148,163,184,.16);
      box-shadow:0 0 0 1px rgba(255,255,255,.10);
    }

    .matchup-player-name{
      min-width:0;
      max-width:100%;
      color:#f8fafc;
      font-size:14px;
      font-weight:900;
      letter-spacing:.02em;
      text-transform:uppercase;
      overflow-wrap:anywhere;
    }

    .matchup-vs{
      color:rgba(241,245,249,.96);
      font-size:13px;
      font-weight:900;
      letter-spacing:.10em;
      text-align:center;
      text-transform:uppercase;
    }

    .matchup-section-head{
      grid-column:1 / -1;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      color:rgba(241,245,249,.95);
      font-size:13px;
      font-weight:900;
      letter-spacing:.12em;
      line-height:1.15;
      text-transform:uppercase;
      padding:12px 0 10px;
    }

    .matchup-section-head::before,
    .matchup-section-head::after{
      content:"";
      height:1px;
      flex:1;
      background:rgba(148,163,184,.36);
    }

    .h2h-summary{
      grid-column:1 / -1;
      display:grid;
      gap:8px;
      padding:3px 2px 5px;
    }

    .h2h-summary-overall{
      gap:10px;
      padding-top:4px;
      padding-bottom:8px;
    }

    .h2h-summary-season{
      width:min(700px, 100%);
      justify-self:center;
      gap:7px;
      padding:0;
    }

    .h2h-summary-title{
      display:grid;
      gap:3px;
      color:#93c5fd;
      font-size:12px;
      font-weight:850;
      letter-spacing:.09em;
      line-height:1.15;
      text-align:center;
      text-transform:uppercase;
    }

    .h2h-summary-overall .h2h-summary-title{
      font-size:13px;
      letter-spacing:.10em;
    }

    .h2h-summary-season .h2h-summary-title{
      font-size:12px;
      font-weight:920;
      letter-spacing:.09em;
    }

    .h2h-summary-title-meta{
      color:rgba(241,245,249,.95);
      font-size:10px;
      font-weight:850;
      letter-spacing:.08em;
    }

    .h2h-progress{
      width:100%;
      height:14px;
      display:flex;
      overflow:hidden;
      border-radius:999px;
      background:rgba(148,163,184,.16);
      box-shadow:inset 0 0 0 1px rgba(148,163,184,.16);
    }

    .h2h-progress[data-empty="true"]{
      background:rgba(148,163,184,.12);
      height:14px;
      min-height:14px;
    }

    .h2h-summary-overall .h2h-progress{
      height:14px;
    }

    .h2h-summary-season .h2h-progress{
      height:14px;
    }

    .h2h-fill{
      height:100%;
      flex:0 0 auto;
    }

    .h2h-fill-a{ background:var(--player-a-color); }
    .h2h-fill-ties{ background:rgba(148,163,184,.64); }
    .h2h-fill-b{ background:var(--player-b-color); }

    .h2h-counts{
      display:grid;
      grid-template-columns:minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr);
      gap:8px;
      align-items:center;
      color:rgba(226,232,240,.92);
      font-size:10px;
      font-weight:850;
      letter-spacing:.06em;
      text-transform:uppercase;
      font-variant-numeric:tabular-nums;
      white-space:nowrap;
    }

    .h2h-summary-overall .h2h-counts{
      font-size:12px;
      letter-spacing:.07em;
    }

    .h2h-summary-season .h2h-counts{
      font-size:8px;
      letter-spacing:.04em;
    }

    .h2h-count-a{
      justify-self:start;
      color:var(--player-a-color);
      text-align:left;
    }

    .h2h-count-ties{
      justify-self:center;
      text-align:center;
      color:rgba(203,213,225,.86);
    }

    .h2h-count-b{
      justify-self:end;
      color:var(--player-b-color);
      text-align:right;
    }

    .h2h-empty-label{
      color:rgba(148,163,184,.86);
      font-size:10px;
      font-weight:850;
      letter-spacing:.08em;
      text-align:center;
      text-transform:uppercase;
    }

    .win-text,
    .loss-text,
    .tie-text{ color:var(--text); }

    .section{
      margin-top:16px;
    }

    .section-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:8px;
    }

    .season-summary-list{
      grid-column:1 / -1;
      display:grid;
      gap:14px;
      padding:4px 0 8px;
    }

    .season-summary-row{
      display:grid;
      justify-items:center;
      padding:0;
    }

    .tournament-match-list{
      grid-column:1 / -1;
      width:100%;
      margin-top:4px;
    }

    .table-wrap{
      overflow:auto;
      border:1px solid var(--line);
      border-radius:8px;
      background:rgba(2,8,23,.30);
    }

    table{
      width:100%;
      border-collapse:collapse;
      font-variant-numeric:tabular-nums;
    }

    th,
    td{
      padding:11px 12px;
      border-bottom:1px solid var(--line);
      text-align:center;
      vertical-align:middle;
      white-space:nowrap;
    }

    th{
      color:var(--muted);
      font-size:12px;
      font-weight:850;
      letter-spacing:.04em;
      text-transform:uppercase;
      background:rgba(15,23,42,.68);
    }

    td{
      color:var(--text);
      font-size:14px;
    }

    tr:last-child td{
      border-bottom:0;
    }

    th:first-child,
    td:first-child{
      text-align:left;
    }

    .empty-row{
      color:var(--muted);
      text-align:center !important;
      white-space:normal;
    }

    @media (max-width:720px){
      main{
        width:min(100vw - 18px, 1040px);
        padding:18px 0 34px;
      }

      .page-head{
        align-items:flex-start;
        padding:14px;
      }

      .title-logo{
        width:32px;
        height:32px;
      }

      .selector-grid{
        grid-template-columns:1fr;
        gap:10px;
        padding:12px;
      }

      .swap-button{
        margin:0;
        justify-self:center;
        transform:rotate(90deg);
      }

      .results{
        padding:12px;
      }

      .section-head{
        align-items:flex-start;
        flex-direction:column;
      }

      .matchup-card{
        grid-template-columns:minmax(0, 1fr) minmax(58px, 76px) minmax(0, 1fr);
        gap:7px 8px;
        padding:11px;
      }

      .matchup-avatar{
        width:40px;
        height:40px;
      }

      .matchup-player-name{
        font-size:11px;
      }

      .matchup-vs{
        font-size:11px;
      }

      .h2h-summary-title{
        font-size:9px;
      }

      .h2h-summary-overall .h2h-summary-title{
        font-size:11px;
      }

      .h2h-progress{
        height:12px;
      }

      .h2h-progress[data-empty="true"]{
        height:12px;
        min-height:12px;
      }

      .h2h-summary-overall .h2h-progress{
        height:12px;
      }

      .h2h-counts{
        gap:4px;
        font-size:8px;
        letter-spacing:.04em;
      }

      .h2h-summary-overall .h2h-counts{
        font-size:10px;
      }

      .season-summary-row{
        padding:0;
      }

      th,
      td{
        padding:9px 8px;
        font-size:12px;
      }

      th{
        font-size:10px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="page-head">
      <div>
        <div class="page-title">
          <img class="title-logo" src="/logos/golf.png" alt="" />
          <h1>Player Compare</h1>
        </div>
      </div>
    </header>

    <section class="compare-panel" aria-label="Player comparison">
      <div class="selector-grid">
        <div class="selector" data-picker="a">
          <label class="selector-label" for="playerSearchA">Player 1</label>
          <div class="player-search">
            <input class="player-search-input" id="playerSearchA" type="search" placeholder="Search players" autocomplete="off" spellcheck="false" aria-label="Search first player" aria-expanded="false" />
            <div class="player-search-actions">
              <button class="player-search-clear" id="playerClearA" type="button" aria-label="Clear first player search">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
                </svg>
              </button>
              <label class="player-color-control" for="playerColorA">
                <input class="player-color-input" id="playerColorA" type="color" value="#e2e8f0" aria-label="Player 1 underline and bar color" />
              </label>
            </div>
            <div class="player-search-results" id="playerSearchResultsA" hidden></div>
          </div>
        </div>

        <button class="swap-button" id="swapPlayers" type="button" aria-label="Swap players">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M7 7h11l-3-3m3 3-3 3M17 17H6l3 3m-3-3 3-3" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <div class="selector" data-picker="b">
          <label class="selector-label" for="playerSearchB">Player 2</label>
          <div class="player-search">
            <input class="player-search-input" id="playerSearchB" type="search" placeholder="Search players" autocomplete="off" spellcheck="false" aria-label="Search second player" aria-expanded="false" />
            <div class="player-search-actions">
              <button class="player-search-clear" id="playerClearB" type="button" aria-label="Clear second player search">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
                </svg>
              </button>
              <label class="player-color-control" for="playerColorB">
                <input class="player-color-input" id="playerColorB" type="color" value="#94a3b8" aria-label="Player 2 underline and bar color" />
              </label>
            </div>
            <div class="player-search-results" id="playerSearchResultsB" hidden></div>
          </div>
        </div>
      </div>

      <div class="status" id="status">Select two current Discord members to compare.</div>

      <div class="results" id="results" hidden>
        <article class="matchup-card" aria-label="Head-to-head comparison summary">
          <div class="matchup-player matchup-player-left" id="matchupPlayerA"></div>
          <div class="matchup-vs" aria-hidden="true">vs.</div>
          <div class="matchup-player matchup-player-right" id="matchupPlayerB"></div>
          <div class="matchup-section-head">Ranked League</div>
          <div class="h2h-summary" id="rankedSummary"></div>
          <div class="season-summary-list" id="seasonBody"></div>
          <div class="matchup-section-head">Tournaments</div>
          <div class="h2h-summary" id="tournamentSummary"></div>
          <div class="table-wrap tournament-match-list">
            <table>
              <thead>
                <tr>
                  <th>Winner</th>
                  <th>Tournament</th>
                  <th>Round</th>
                </tr>
              </thead>
              <tbody id="tournamentBody"></tbody>
            </table>
          </div>
        </article>
      </div>
    </section>
  </main>

  <script type="module">
    import { createBrowserSupabaseClient } from "/auth/supabase-auth.js";

    const supabase = createBrowserSupabaseClient();
    const MEMBER_PAGE_SIZE = 1000;
    const PLAYER_SEARCH_LIMIT = 8;
    const DEFAULT_PLAYER_COLORS = { a:"#e2e8f0", b:"#94a3b8" };
    const state = {
      memberSearchRows: [],
      memberSearchPromise: null,
      selected: { a:null, b:null },
      colors: { ...DEFAULT_PLAYER_COLORS },
      comparisonToken: 0,
    };

    const pickers = {
      a: {
        input: document.getElementById("playerSearchA"),
        results: document.getElementById("playerSearchResultsA"),
        colorInput: document.getElementById("playerColorA"),
        clearButton: document.getElementById("playerClearA"),
      },
      b: {
        input: document.getElementById("playerSearchB"),
        results: document.getElementById("playerSearchResultsB"),
        colorInput: document.getElementById("playerColorB"),
        clearButton: document.getElementById("playerClearB"),
      },
    };

    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");
    const matchupPlayerAEl = document.getElementById("matchupPlayerA");
    const matchupPlayerBEl = document.getElementById("matchupPlayerB");
    const rankedSummaryEl = document.getElementById("rankedSummary");
    const tournamentSummaryEl = document.getElementById("tournamentSummary");
    const seasonBodyEl = document.getElementById("seasonBody");
    const tournamentBodyEl = document.getElementById("tournamentBody");
    const swapPlayersEl = document.getElementById("swapPlayers");

    function normalizeText(value){
      return String(value ?? "").trim();
    }

    function normalizeDiscordId(value){
      const clean = normalizeText(value);
      return /^[0-9]+$/.test(clean) ? clean : "";
    }

    function normalizeSearchKey(value){
      return normalizeText(value).toLowerCase().replace(/\s+/g, " ");
    }

    function normalizeHexColor(value, fallback){
      const clean = normalizeText(value);
      const match = clean.match(/^#?([0-9a-f]{6})$/i);
      return match ? `#${match[1].toLowerCase()}` : fallback;
    }

    function applyPlayerColors(){
      document.documentElement.style.setProperty("--player-a-color", state.colors.a);
      document.documentElement.style.setProperty("--player-b-color", state.colors.b);
      pickers.a.colorInput.value = state.colors.a;
      pickers.b.colorInput.value = state.colors.b;
    }

    function updateSearchClearState(key){
      const picker = pickers[key];
      picker.input.closest(".player-search").dataset.hasValue = normalizeText(picker.input.value) ? "true" : "false";
    }

    function escapeHtml(value){
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function avatarUrlForMember(member){
      return member?.server_avatar_url || member?.avatar_url || "/logos/golf.png";
    }

    function displayNameForMember(member){
      return normalizeText(member?.display_name) || normalizeText(member?.username) || normalizeDiscordId(member?.discord_user_id) || "Player";
    }

    function usernameForMember(member){
      return normalizeText(member?.username) || normalizeDiscordId(member?.discord_user_id);
    }

    function emptyRecord(){
      return { wins:0, losses:0, ties:0 };
    }

    function addOutcome(record, outcome){
      if(outcome === "win") record.wins += 1;
      else if(outcome === "loss") record.losses += 1;
      else record.ties += 1;
    }

    function recordTotal(record){
      return record.wins + record.losses + record.ties;
    }

    function h2hPercentages(record){
      const total = recordTotal(record);
      if(total <= 0) return { wins:0, losses:0, ties:0 };
      return {
        wins:(record.wins / total) * 100,
        ties:(record.ties / total) * 100,
        losses:(record.losses / total) * 100,
      };
    }

    function winLabel(count){
      return `${count} ${count === 1 ? "WIN" : "WINS"}`;
    }

    function tieLabel(count){
      return `${count} ${count === 1 ? "TIE" : "TIES"}`;
    }

    function matchTotalLabel(count){
      return `${count} ${count === 1 ? "MATCH" : "MATCHES"}`;
    }

    function h2hSummaryHtml(label, record, options = {}){
      const total = recordTotal(record);
      const percentages = h2hPercentages(record);
      const shouldShowTitle = options.showTitle !== false;
      const shouldShowTotal = options.showTotal === true;
      const emptyText = total === 0 ? normalizeText(options.emptyText) : "";
      return `
        ${shouldShowTitle ? `<div class="h2h-summary-title"><span>${escapeHtml(label)}</span>${shouldShowTotal ? `<span class="h2h-summary-title-meta">${escapeHtml(matchTotalLabel(total))}</span>` : ""}</div>` : ""}
        <div class="h2h-progress" data-empty="${total === 0 ? "true" : "false"}" aria-label="${escapeHtml(label)} head-to-head win distribution">
          <span class="h2h-fill h2h-fill-a" style="width:${percentages.wins}%"></span>
          <span class="h2h-fill h2h-fill-ties" style="width:${percentages.ties}%"></span>
          <span class="h2h-fill h2h-fill-b" style="width:${percentages.losses}%"></span>
        </div>
        ${emptyText ? `<div class="h2h-empty-label">${escapeHtml(emptyText)}</div>` : `<div class="h2h-counts">
          <span class="h2h-count-a">${escapeHtml(winLabel(record.wins))}</span>
          <span class="h2h-count-ties">${escapeHtml(tieLabel(record.ties))}</span>
          <span class="h2h-count-b">${escapeHtml(winLabel(record.losses))}</span>
        </div>`}
      `;
    }

    function matchupPlayerHtml(member){
      return `
        <img class="matchup-avatar" src="${escapeHtml(avatarUrlForMember(member))}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" />
        <div class="matchup-player-name">${escapeHtml(displayNameForMember(member))}</div>
      `;
    }

    function showStatus(message, isError = false){
      statusEl.hidden = false;
      statusEl.textContent = message;
      statusEl.style.color = isError ? "var(--danger)" : "var(--muted)";
      resultsEl.hidden = true;
    }

    function hideStatus(){
      statusEl.hidden = true;
      resultsEl.hidden = false;
    }

    async function loadMemberSearchRows(){
      if(state.memberSearchRows.length) return state.memberSearchRows;
      if(state.memberSearchPromise) return state.memberSearchPromise;

      state.memberSearchPromise = (async () => {
        const rows = [];
        for(let from = 0;; from += MEMBER_PAGE_SIZE){
          const to = from + MEMBER_PAGE_SIZE - 1;
          const { data, error } = await supabase
            .from("discord_guild_members")
            .select("discord_user_id,username,display_name,server_avatar_url,avatar_url")
            .eq("is_current_member", true)
            .range(from, to);

          if(error) throw error;
          rows.push(...(data || []));
          if(!data || data.length < MEMBER_PAGE_SIZE) break;
        }

        state.memberSearchRows = rows
          .filter(member => normalizeDiscordId(member?.discord_user_id))
          .map(member => ({
            ...member,
            displaySearch: normalizeSearchKey(member.display_name),
            usernameSearch: normalizeSearchKey(member.username),
          }));
        return state.memberSearchRows;
      })().finally(() => {
        state.memberSearchPromise = null;
      });

      return state.memberSearchPromise;
    }

    function scoreMemberSearchResult(member, query){
      const display = member.displaySearch;
      const username = member.usernameSearch;
      if(!query) return 0;
      if(display === query) return 120;
      if(username === query) return 110;
      if(display.startsWith(query)) return 95;
      if(username.startsWith(query)) return 85;
      if(display.includes(query)) return 65;
      if(username.includes(query)) return 55;
      return 0;
    }

    function hidePickerResults(key){
      pickers[key].results.hidden = true;
      pickers[key].input.setAttribute("aria-expanded", "false");
    }

    function showPickerResults(key){
      pickers[key].results.hidden = false;
      pickers[key].input.setAttribute("aria-expanded", "true");
    }

    function renderPickerResults(key, results, query){
      const picker = pickers[key];
      picker.results.innerHTML = "";

      if(!query){
        hidePickerResults(key);
        return;
      }

      if(!results.length){
        const empty = document.createElement("p");
        empty.className = "player-search-empty";
        empty.textContent = "No players found.";
        picker.results.appendChild(empty);
        showPickerResults(key);
        return;
      }

      for(const member of results){
        const button = document.createElement("button");
        button.className = "player-search-result";
        button.type = "button";
        button.dataset.playerId = member.discord_user_id;

        const avatar = document.createElement("img");
        avatar.className = "player-search-avatar";
        avatar.src = avatarUrlForMember(member);
        avatar.alt = "";
        avatar.loading = "lazy";
        avatar.decoding = "async";
        avatar.referrerPolicy = "no-referrer";

        const copy = document.createElement("span");
        copy.className = "player-search-copy";

        const displayName = document.createElement("span");
        displayName.className = "player-search-display";
        displayName.textContent = displayNameForMember(member);

        const username = document.createElement("span");
        username.className = "player-search-username";
        username.textContent = usernameForMember(member);

        copy.append(displayName, username);
        button.append(avatar, copy);
        picker.results.appendChild(button);
      }

      showPickerResults(key);
    }

    async function updatePickerSearch(key){
      const query = normalizeSearchKey(pickers[key].input.value);
      if(!query){
        hidePickerResults(key);
        return;
      }

      try{
        const rows = await loadMemberSearchRows();
        const results = rows
          .map(member => ({ member, score:scoreMemberSearchResult(member, query) }))
          .filter(result => result.score > 0)
          .sort((left, right) => {
            if(right.score !== left.score) return right.score - left.score;
            return displayNameForMember(left.member).localeCompare(displayNameForMember(right.member));
          })
          .slice(0, PLAYER_SEARCH_LIMIT)
          .map(result => result.member);
        renderPickerResults(key, results, query);
      }catch(error){
        console.error(error);
        pickers[key].results.innerHTML = `<p class="player-search-empty">Could not load players.</p>`;
        showPickerResults(key);
      }
    }

    function renderSelectedInput(key){
      const member = state.selected[key];
      const picker = pickers[key];
      if(!member){
        picker.input.value = "";
        updateSearchClearState(key);
        return;
      }

      picker.input.value = displayNameForMember(member);
      updateSearchClearState(key);
    }

    function updateUrl(){
      const url = new URL(window.location.href);
      const playerA = normalizeDiscordId(state.selected.a?.discord_user_id);
      const playerB = normalizeDiscordId(state.selected.b?.discord_user_id);
      if(playerA) url.searchParams.set("a", playerA);
      else url.searchParams.delete("a");
      if(playerB) url.searchParams.set("b", playerB);
      else url.searchParams.delete("b");
      if(state.colors.a !== DEFAULT_PLAYER_COLORS.a) url.searchParams.set("ca", state.colors.a.slice(1));
      else url.searchParams.delete("ca");
      if(state.colors.b !== DEFAULT_PLAYER_COLORS.b) url.searchParams.set("cb", state.colors.b.slice(1));
      else url.searchParams.delete("cb");
      window.history.replaceState({}, "", url);
    }

    function selectPlayer(key, member){
      state.selected[key] = member;
      renderSelectedInput(key);
      hidePickerResults(key);
      updateUrl();
      void runComparison();
    }

    function clearPicker(key){
      const picker = pickers[key];
      state.selected[key] = null;
      picker.input.value = "";
      updateSearchClearState(key);
      hidePickerResults(key);
      updateUrl();
      picker.input.focus();
      void runComparison();
    }

    async function loadPlayersFromUrl(){
      const params = new URLSearchParams(window.location.search);
      state.colors.a = normalizeHexColor(params.get("ca"), DEFAULT_PLAYER_COLORS.a);
      state.colors.b = normalizeHexColor(params.get("cb"), DEFAULT_PLAYER_COLORS.b);
      applyPlayerColors();
      const ids = [normalizeDiscordId(params.get("a")), normalizeDiscordId(params.get("b"))].filter(Boolean);
      if(!ids.length) return;

      try{
        const members = await loadMemberSearchRows();
        const byId = new Map(members.map(member => [normalizeDiscordId(member.discord_user_id), member]));
        const playerA = byId.get(normalizeDiscordId(params.get("a")));
        const playerB = byId.get(normalizeDiscordId(params.get("b")));
        if(playerA) state.selected.a = playerA;
        if(playerB) state.selected.b = playerB;
        renderSelectedInput("a");
        renderSelectedInput("b");
      }catch(error){
        console.error(error);
      }
    }

    async function loadRankedHeadToHeadMatches(playerAId, playerBId){
      const { data, error } = await supabase.rpc("get_internal_ranked_head_to_head_matches", {
        player_a_id: playerAId,
        player_b_id: playerBId,
      });
      if(error) throw error;
      return (data || []).sort((left, right) => {
        const leftTimestamp = Number(left.timestamp_ms) || 0;
        const rightTimestamp = Number(right.timestamp_ms) || 0;
        if(leftTimestamp !== rightTimestamp) return leftTimestamp - rightTimestamp;
        return normalizeText(left.match_hash).localeCompare(normalizeText(right.match_hash));
      });
    }

    function summarizeRankedMatches(rows){
      const total = emptyRecord();
      const seasons = new Map();

      for(const row of rows){
        const placeA = Number(row.player_a_place);
        const placeB = Number(row.player_b_place);
        if(!Number.isFinite(placeA) || !Number.isFinite(placeB)) continue;

        const outcome = placeA < placeB ? "win" : placeA > placeB ? "loss" : "tie";
        addOutcome(total, outcome);

        const season = Number(row.season);
        if(!seasons.has(season)) seasons.set(season, emptyRecord());
        addOutcome(seasons.get(season), outcome);
      }

      return { total, seasons };
    }

    async function loadTournamentMatches(playerAId, playerBId){
      const select = "event_name,round_label,played_at,event_order,match_order,player_a_discord_user_id,player_a_name,player_b_discord_user_id,player_b_name,winner_discord_user_id";
      const [left, right] = await Promise.all([
        supabase
          .from("internal_tournament_matches")
          .select(select)
          .eq("player_a_discord_user_id", playerAId)
          .eq("player_b_discord_user_id", playerBId)
          .order("event_order", { ascending:true })
          .order("match_order", { ascending:true }),
        supabase
          .from("internal_tournament_matches")
          .select(select)
          .eq("player_a_discord_user_id", playerBId)
          .eq("player_b_discord_user_id", playerAId)
          .order("event_order", { ascending:true })
          .order("match_order", { ascending:true }),
      ]);

      if(left.error) throw left.error;
      if(right.error) throw right.error;
      return [...(left.data || []), ...(right.data || [])]
        .sort((a, b) => {
          const eventDiff = (Number(a.event_order) || 0) - (Number(b.event_order) || 0);
          if(eventDiff) return eventDiff;
          return (Number(a.match_order) || 0) - (Number(b.match_order) || 0);
        });
    }

    function summarizeTournamentMatches(playerAId, playerBId, matches){
      const total = emptyRecord();
      const rows = matches.map((match) => {
        const winnerId = normalizeDiscordId(match.winner_discord_user_id);
        const outcome = winnerId === playerAId ? "win" : winnerId === playerBId ? "loss" : "tie";
        addOutcome(total, outcome);
        return { ...match, outcome };
      });
      return { total, rows };
    }

    function renderSeasonRows(seasons){
      const rows = [...seasons.entries()]
        .sort((left, right) => Number(left[0]) - Number(right[0]));

      if(!rows.length){
        seasonBodyEl.innerHTML = `<div class="empty-row">No tracked Ranked League head-to-head matches.</div>`;
        return;
      }

      seasonBodyEl.innerHTML = rows.map(([season, record]) => `
        <div class="season-summary-row">
          <div class="h2h-summary h2h-summary-season">${h2hSummaryHtml(`Season ${season}`, record, { showTotal:true })}</div>
        </div>
      `).join("");
    }

    function renderTournamentRows(playerA, playerB, matches){
      if(!matches.length){
        tournamentBodyEl.innerHTML = `<tr><td class="empty-row" colspan="3">No tracked tournament head-to-head matches.</td></tr>`;
        return;
      }

      tournamentBodyEl.innerHTML = matches.map((match) => {
        const winnerId = normalizeDiscordId(match.winner_discord_user_id);
        const winnerName = winnerId === normalizeDiscordId(playerA?.discord_user_id)
          ? displayNameForMember(playerA)
          : winnerId === normalizeDiscordId(playerB?.discord_user_id)
            ? displayNameForMember(playerB)
            : "Tie";
        return `
          <tr>
            <td>${escapeHtml(winnerName)}</td>
            <td>${escapeHtml(match.event_name || "")}</td>
            <td>${escapeHtml(match.round_label || "")}</td>
          </tr>
        `;
      }).join("");
    }

    function renderComparison(playerA, playerB, ranked, tournament){
      matchupPlayerAEl.innerHTML = matchupPlayerHtml(playerA);
      matchupPlayerBEl.innerHTML = matchupPlayerHtml(playerB);
      rankedSummaryEl.className = "h2h-summary h2h-summary-overall";
      tournamentSummaryEl.className = "h2h-summary";
      rankedSummaryEl.innerHTML = h2hSummaryHtml("Overall", ranked.total, { showTotal:true });
      tournamentSummaryEl.innerHTML = h2hSummaryHtml("Tournaments", tournament.total, { showTitle:false, emptyText:"NO MATCHES" });
      renderSeasonRows(ranked.seasons);
      renderTournamentRows(playerA, playerB, tournament.rows);
      hideStatus();
    }

    async function runComparison(){
      const playerA = state.selected.a;
      const playerB = state.selected.b;
      const playerAId = normalizeDiscordId(playerA?.discord_user_id);
      const playerBId = normalizeDiscordId(playerB?.discord_user_id);

      if(!playerAId || !playerBId){
        showStatus("Select two current Discord members to compare.");
        return;
      }

      if(playerAId === playerBId){
        showStatus("Choose two different players.", true);
        return;
      }

      const token = ++state.comparisonToken;
      showStatus("Loading head-to-head records...");

      try{
        const [rankedMatches, tournamentMatches] = await Promise.all([
          loadRankedHeadToHeadMatches(playerAId, playerBId),
          loadTournamentMatches(playerAId, playerBId),
        ]);

        if(token !== state.comparisonToken) return;

        renderComparison(
          playerA,
          playerB,
          summarizeRankedMatches(rankedMatches),
          summarizeTournamentMatches(playerAId, playerBId, tournamentMatches)
        );
      }catch(error){
        console.error(error);
        showStatus(`Unable to load comparison: ${error.message || "unknown error"}`, true);
      }
    }

    for(const key of Object.keys(pickers)){
      const picker = pickers[key];
      picker.input.addEventListener("focus", () => {
        updateSearchClearState(key);
        void loadMemberSearchRows();
        void updatePickerSearch(key);
      });
      picker.input.addEventListener("input", () => {
        updateSearchClearState(key);
        void updatePickerSearch(key);
      });
      picker.results.addEventListener("click", (event) => {
        const result = event.target.closest(".player-search-result[data-player-id]");
        if(!result) return;
        const id = normalizeDiscordId(result.dataset.playerId);
        const member = state.memberSearchRows.find(row => normalizeDiscordId(row.discord_user_id) === id);
        if(member) selectPlayer(key, member);
      });
      picker.colorInput.addEventListener("input", () => {
        state.colors[key] = normalizeHexColor(picker.colorInput.value, DEFAULT_PLAYER_COLORS[key]);
        applyPlayerColors();
        updateUrl();
      });
      picker.clearButton.addEventListener("click", () => {
        clearPicker(key);
      });
    }

    document.addEventListener("click", (event) => {
      for(const key of Object.keys(pickers)){
        const pickerRoot = pickers[key].input.closest(".selector");
        if(!pickerRoot.contains(event.target)) hidePickerResults(key);
      }
    });

    swapPlayersEl.addEventListener("click", () => {
      const previousA = state.selected.a;
      state.selected.a = state.selected.b;
      state.selected.b = previousA;
      renderSelectedInput("a");
      renderSelectedInput("b");
      updateUrl();
      void runComparison();
    });

    applyPlayerColors();
    renderSelectedInput("a");
    renderSelectedInput("b");
    await loadPlayersFromUrl();
    void runComparison();
  </script>
  <script type="module" src="/site-topbar.js"></script>
</body>
</html>
